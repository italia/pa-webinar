# ─────────────────────────────────────────────────────────────
# pa-webinar — Example production overrides
#
# Builds on examples/values-full.yaml with per-instance domains, resources and
# an externally managed Secret. Domains below use example.com placeholders: the
# real values of a running instance (domains, cluster, node pool labels, Secret
# names) live in the configuration repository of whoever operates it, not here.
#
# Usage:
#   helm upgrade --install videocall ./infra/helm/pa-webinar \
#     -f values.yaml \
#     -f values-production.yaml \
#     -n videocall \
#     --set jitsi-meet.prosody.jwt.secret=$JITSI_JWT_SECRET \
#     -f <file with the pinned internal Jitsi passwords>
#
# The conference verifies the portal's tokens with the same value as
# JITSI_JWT_SECRET in the application Secret. The internal XMPP passwords
# (jitsi-meet.jicofo.xmpp.password, jitsi-meet.jvb.xmpp.password,
# jitsi-meet.jibri.xmpp.password, jitsi-meet.jibri.recorder.password) are
# generated once and passed on every upgrade: the chart refuses to render
# without them (jitsi.requirePinnedCredentials below).
# ─────────────────────────────────────────────────────────────

app:
  replicaCount: 2

  image:
    repository: ghcr.io/italia/pa-webinar
    tag: "v0.2.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # AKS "applications" node pool
  nodeSelector:
    agentpool: applications

  env:
    NEXT_PUBLIC_JITSI_DOMAIN: "jitsi.videocall.example.com"
    NEXT_PUBLIC_APP_URL: "https://videocall.example.com"
    NEXT_PUBLIC_DEFAULT_LOCALE: "it"
    # rnnoise ACCESO in produzione. Qui gira l'immagine jitsi/web patchata a
    # 48 kHz, dove la soppressione avanzata del rumore funziona; su dev/test
    # gira quella stock, dove zittisce il microfono, e la si tiene spenta
    # (default). Il flag e' letto a RUNTIME (vedi lib/jitsi/rnnoise): se non
    # fosse qui, il pod ripiegherebbe sul default e la spegnerebbe anche in
    # prod, in silenzio, al primo deploy.
    NEXT_PUBLIC_JITSI_RNNOISE_ENFORCE: "false"
    DEFAULT_DATA_RETENTION_DAYS: "90"
    DEFAULT_PRIVACY_POLICY_URL: "https://videocall.example.com/it/privacy"

# ── Secrets ──────────────────────────────────────────────────

secrets:
  mode: "existing"
  existingSecretName: "videocall-secrets"

# ── Ingress ──────────────────────────────────────────────────

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Rate limiting: 10 req/s per IP, burst up to 50 (5x multiplier)
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    # WebSocket support for live event polling
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: videocall.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: videocall-tls
      hosts:
        - videocall.example.com

# ── Autoscaling ──────────────────────────────────────────────

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ── PostgreSQL — Azure Database for PostgreSQL Flexible Server ──

postgresql:
  enabled: false
  external:
    host: "<db-server>.postgres.database.azure.com"
    port: 5432
    database: "pa_webinar"
    existingSecret: "videocall-secrets"
    secretKey: "DATABASE_URL"

# ── Jitsi Meet — full mode with dedicated JVB nodes ──

# Bot recorder (registrazione per-partecipante, ADR-013).
recorder:
  enabled: true
  # Tag mutabile `:dev`: senza questo un nodo puo' riusare un layer in cache e
  # registrare col codice di ieri. Vedi la nota estesa in values.yaml.
  imagePullPolicy: Always
  # Il bot entra sul dominio nascosto di Prosody e sparisce dall'interfaccia
  # Jitsi in modo nativo: nessun riquadro, nessuna riga nell'elenco, nessuna
  # notifica di ingresso, escluso dal conteggio. Va in coppia con
  # `jitsi-meet.prosody.extraEnvs.XMPP_MUC_CONFIGURATION` piu' sotto: senza
  # quella deroga il MUC rifiuta chi non presenta un token.
  hiddenDomain: "hidden.meet.jitsi"
  # Secret gia' creato dal subchart jitsi per Jibri: nessuna credenziale nuova.
  # NB: `jitsi-meet.jibri.recorder.password` DEVE restare pinnata nei values del
  # deploy, altrimenti ogni upgrade la rigenera e il login del bot fallisce.
  xmppSecretName: "pa-webinar-jitsi-meet-jibri-secret-recorder"

jitsi:
  enabled: true
  mode: full
  requirePinnedCredentials: true

jitsi-meet:
  publicURL: "https://jitsi.videocall.example.com"
  enableAuth: true
  enableGuests: false

  # L'immagine web patchata qui sotto è privata: serve la credenziale di
  # prelievo, che deve già esistere nel namespace.
  imagePullSecrets:
    - name: ghcr-secret

  prosody:
    # The JWT secret is passed at install time (see the header).
    extraEnvs:
      # Il bot recorder entra come `recorder@hidden.meet.jitsi` invece che col
      # JWT del portale: e' cosi' che jitsi-meet lo nasconde NATIVAMENTE (ogni
      # client confronta il dominio del JID con `config.hiddenDomain`, gia'
      # impostato dall'immagine). Con l'autenticazione a token, pero', il
      # componente MUC rifiuterebbe chi non presenta un token: questa e' la
      # deroga prevista da mod_token_verification, ed e' il motivo per cui la
      # riga esiste ("allowlist for participants, jigasi, jibri").
      #
      # E' un SINGOLO account, non l'intero dominio: chi ha quella password
      # entra senza token, quindi la deroga resta la piu' stretta possibile.
      # La password e' quella che il subchart genera gia' per Jibri.
      XMPP_MUC_CONFIGURATION: 'token_verification_allowlist = { "recorder@hidden.meet.jitsi" }'

    nodeSelector:
      agentpool: applications

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  jicofo:
    nodeSelector:
      agentpool: applications
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    env:
      JICOFO_ENABLE_AUTO_OWNER: "false"
      JICOFO_AUTHENTICATION_TYPE: "jwt"
      JICOFO_CONF_INITIAL_PARTICIPANT_WAIT_TIMEOUT: "30"
      JICOFO_CONF_SINGLE_PARTICIPANT_TIMEOUT: "0"

  jvb:
    replicaCount: 0
    # STUN stays on the default (a third-party server, jitsi.net). To drop
    # it set `publicIPs` (one bridge behind a fixed IP) and `stunServers: ""`,
    # or point `stunServers` to your own server (see values.yaml).
    nodeSelector:
      workload: jitsi-jvb
    tolerations:
      - key: workload
        value: jitsi-jvb
        effect: NoSchedule
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "3"
        memory: 4Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        selector:
          release: prometheus

  jibri:
    enabled: true
    replicaCount: 0
    singleUseMode: true
    nodeSelector:
      workload: jitsi-jvb
    tolerations:
      - key: workload
        value: jitsi-jvb
        effect: NoSchedule
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

  web:
    # Questo profilo accende la soppressione rumore avanzata
    # (`NEXT_PUBLIC_JITSI_RNNOISE_ENFORCE: "false"` nell'env dell'app, sopra), e
    # quella funziona SOLO con l'immagine patchata a 48 kHz: sull'immagine stock
    # ammutolisce i microfoni, e il danno si scopre a evento iniziato. Le due
    # impostazioni si cambiano insieme, sempre nella stessa direzione.
    # `pullPolicy: Always` perché il tag viene riscritto sul posto quando la
    # patch cambia: un nodo che serve una copia vecchia ammutolirebbe in
    # silenzio, mentre un prelievo fallito è un guasto visibile e reversibile.
    # Il tag porta una revisione che sale a ogni modifica della patch: è
    # `IMAGE_TAG` in .github/workflows/jitsi-web.yml, e va riallineato qui
    # quando quella cambia, altrimenti si torna indietro di una revisione senza
    # accorgersene.
    image:
      repository: ghcr.io/italia/pa-webinar-jitsi-web
      tag: stable-10741-rnnoise-r3
      pullPolicy: Always
    ingress:
      enabled: true
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        nginx.ingress.kubernetes.io/server-snippet: |
          location = / { return 403; }
          location = /index.html { return 403; }
      hosts:
        # Lista di stringhe: il sottochart fissato le rende direttamente in
        # `path:` e aggiunge da sé `pathType: Prefix`. Vedi values.yaml.
        - host: jitsi.videocall.example.com
          paths: ["/"]
      tls:
        - secretName: jitsi-tls
          hosts:
            - jitsi.videocall.example.com

# ── JVB auto-scaler ─────────────────────────────────────────

jvbScaler:
  enabled: true
  schedule: "*/2 * * * *"
  # Image: the chart's pinned kubectlImage.
  jvbDeploymentName: ""  # Auto-detect by label

# ── CronJobs ─────────────────────────────────────────────────

cronjobs:
  reminders:
    enabled: true
    schedule: "*/15 * * * *"
  cleanup:
    enabled: true
    schedule: "0 3 * * *"

# ── Metrics ──────────────────────────────────────────────────

metrics:
  serviceMonitor:
    enabled: true
    interval: 15s
    additionalLabels:
      release: prometheus
