# ============================================================================
# Modalità standard — DB esterno, risorse dedicate, recording
# ============================================================================
#
# Deploy:
#   kubectl create namespace videocall
#   kubectl create secret generic videocall-secrets -n videocall --from-literal=...
#   # Il segreto con cui la conferenza verifica i token: la sola chiave
#   # JWT_APP_SECRET, con lo stesso valore di JITSI_JWT_SECRET qui sopra.
#   kubectl create secret generic videocall-jitsi-jwt -n videocall \
#     --from-literal=JWT_APP_SECRET=<stesso valore di JITSI_JWT_SECRET>
#   helm upgrade --install videocall ./infra/helm/pa-webinar \
#     -f infra/helm/pa-webinar/examples/values-standard.yaml -n videocall \
#     -f <file con i tuoi domini e le password XMPP qui sotto>
#
# Password XMPP interne da generare UNA volta (openssl rand -hex 16) e
# ripassare identiche a ogni aggiornamento: jitsi-meet.jicofo.xmpp.password,
# jitsi-meet.jvb.xmpp.password, jitsi-meet.jibri.xmpp.password,
# jitsi-meet.jibri.recorder.password. Se cambiano, ogni aggiornamento
# riavvia la conferenza e fa cadere le chiamate in corso.
#
# Cosa include:
#   - 2 repliche dell'app con HPA (2-4)
#   - Database esterno (Azure DB, RDS, Cloud SQL, ecc.)
#   - Jitsi con 1 JVB + Jibri per recording
#   - PodDisruptionBudget
#   - Nessun requisito di node pool dedicati
#
# Ideale per: PA di medie dimensioni, fino a 200 partecipanti per evento
# ============================================================================

app:
  replicaCount: 2
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Secrets — pre-created by the user
secrets:
  mode: "existing"
  existingSecretName: "videocall-secrets"

# External database
postgresql:
  enabled: false
  external:
    existingSecret: "videocall-secrets"
    secretKey: "DATABASE_URL"

# Jitsi — standard mode
jitsi:
  enabled: true
  mode: standard
  # Con `true` la resa si ferma se le password XMPP interne qui sotto non sono
  # fissate; senza, le note dopo l'installazione le elencano. Accendilo nel
  # tuo file di valori insieme alle password.
  requirePinnedCredentials: false

jitsi-meet:
  prosody:
    jwt:
      # Secret creato insieme a videocall-secrets (vedi sopra), con la sola
      # chiave JWT_APP_SECRET = stesso valore di JITSI_JWT_SECRET.
      existingSecretName: "videocall-jitsi-jwt"
  jicofo:
    xmpp:
      password: ""  # Set via --set, fissa
  jvb:
    replicaCount: 1
    nodeSelector: {}
    tolerations: []
    xmpp:
      password: ""  # Set via --set, fissa
    # STUN: resta quello predefinito (jitsi.net). Per farne a meno indica
    # `publicIPs` e poi `stunServers: ""`, oppure un tuo server STUN in
    # `stunServers` (vedi values.yaml).
  jibri:
    enabled: true
    replicaCount: 1
    xmpp:
      password: ""  # Set via --set, fissa
    recorder:
      password: ""  # Set via --set, fissa

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: videocall.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: videocall-tls
      hosts:
        - videocall.example.com

metrics:
  serviceMonitor:
    enabled: false
