# ============================================================================
# Modalità completa — multi-pool, scale-to-zero, monitoraggio
# ============================================================================
#
# Per grandi PA con cluster Kubernetes dedicati.
# Pensato per un cluster con node pool dedicati (AKS, GKE, EKS o k3s): le
# etichette dei pool vanno adattate al provider, vedi i nodeSelector qui sotto.
#
# Deploy:
#   kubectl create namespace videocall
#   kubectl create secret generic videocall-secrets -n videocall --from-literal=...
#   # Il segreto con cui la conferenza verifica i token: la sola chiave
#   # JWT_APP_SECRET, con lo stesso valore di JITSI_JWT_SECRET qui sopra.
#   kubectl create secret generic videocall-jitsi-jwt -n videocall \
#     --from-literal=JWT_APP_SECRET=<stesso valore di JITSI_JWT_SECRET>
#   helm upgrade --install videocall ./infra/helm/pa-webinar \
#     -f infra/helm/pa-webinar/examples/values-full.yaml -n videocall \
#     -f <file con i tuoi domini e le password XMPP qui sotto>
#
# Password XMPP interne da generare UNA volta (openssl rand -hex 16) e
# ripassare identiche a ogni aggiornamento: jitsi-meet.jicofo.xmpp.password,
# jitsi-meet.jvb.xmpp.password, jitsi-meet.jibri.xmpp.password,
# jitsi-meet.jibri.recorder.password. Se cambiano, ogni aggiornamento
# riavvia la conferenza e fa cadere le chiamate in corso.
#
# Cosa include:
#   - 2+ repliche dell'app con HPA (2-8)
#   - Database esterno
#   - Jitsi con JVB su nodi dedicati, scale-to-zero
#   - Jibri per recording su nodi dedicati
#   - CronJob scaler per JVB (no KEDA richiesto)
#   - ServiceMonitor per Prometheus
#   - PodDisruptionBudget
#
# Prerequisiti:
#   - Node pool general-purpose per l'app (es. "applications")
#   - Node pool dedicato per JVB/Jibri con taint workload=jitsi-jvb:NoSchedule
#   - Prometheus Operator (opzionale, per ServiceMonitor)
#
# Ideale per: grandi PA, 300+ partecipanti, eventi frequenti
# ============================================================================

app:
  replicaCount: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1Gi

  # Pool general-purpose. Vuoto = qualunque nodo senza taint, cioè fuori dai
  # pool dedicati di bridge e GPU, che hanno un taint. Per fissare il pool si
  # usa l'etichetta del provider (sono diverse fra loro):
  #   AKS:  { agentpool: applications }
  #   GKE:  { cloud.google.com/gke-nodepool: applications }
  #   EKS:  { eks.amazonaws.com/nodegroup: applications }  (solo managed node group)
  #   k3s / on-premise: un'etichetta messa a mano, per esempio
  #         kubectl label node <nodo> workload=applications
  # CronJob, scaler e controller della registrazione ereditano questo valore:
  # un'etichetta che nessun nodo porta li lascia tutti in Pending.
  nodeSelector: {}

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Secrets — pre-created or via External Secrets Operator
secrets:
  mode: "existing"
  existingSecretName: "videocall-secrets"
  # Uncomment for External Secrets Operator (il Secret videocall-jitsi-jwt lo
  # produce allora il chart, dalla stessa voce remota di JITSI_JWT_SECRET):
  # mode: "external"
  # jitsiJwtSecretName: "videocall-jitsi-jwt"
  # external:
  #   provider: "azure-key-vault"
  #   azureKeyVault:
  #     vaultUrl: "https://my-vault.vault.azure.net"
  #     tenantId: "00000000-0000-0000-0000-000000000000"

# External database
postgresql:
  enabled: false
  external:
    existingSecret: "videocall-secrets"
    secretKey: "DATABASE_URL"

# Jitsi — full mode with dedicated nodes and scale-to-zero
jitsi:
  enabled: true
  mode: full
  # Con `true` la resa si ferma se le password XMPP interne qui sotto non sono
  # fissate; senza, le note dopo l'installazione le elencano. Accendilo nel
  # tuo file di valori insieme alle password.
  requirePinnedCredentials: false

jitsi-meet:
  prosody:
    jwt:
      # Secret creato insieme a videocall-secrets (vedi sopra), con la sola
      # chiave JWT_APP_SECRET = stesso valore di JITSI_JWT_SECRET.
      existingSecretName: "videocall-jitsi-jwt"
  jicofo:
    xmpp:
      password: ""  # Set via --set, fissa
  jvb:
    replicaCount: 0  # Scale-to-zero, managed by jvbScaler CronJob
    xmpp:
      password: ""  # Set via --set, fissa
    # STUN: resta quello predefinito (jitsi.net). Il bridge annuncia
    # l'indirizzo del nodo e, dietro un NAT, lo scopre con STUN. Per fare a
    # meno di un server di terzi usa il coturn del chart (`coturn.enabled`,
    # `turnHost`, `useInternalStun: true`) o un tuo server in `stunServers`;
    # con un solo bridge dietro un IP fisso basta `publicIPs` con
    # `stunServers: ""`.
    nodeSelector:
      workload: jitsi-jvb
    tolerations:
      - key: workload
        value: jitsi-jvb
        effect: NoSchedule
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "3"
        memory: 4Gi
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        selector:
          release: prometheus

  jibri:
    enabled: true
    replicaCount: 0  # Scaled up only when recording
    singleUseMode: true
    xmpp:
      password: ""  # Set via --set, fissa
    recorder:
      password: ""  # Set via --set, fissa
    nodeSelector:
      workload: jitsi-jvb
    tolerations:
      - key: workload
        value: jitsi-jvb
        effect: NoSchedule
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi

# JVB auto-scaler CronJob (no KEDA required)
jvbScaler:
  enabled: true
  schedule: "*/5 * * * *"
  # Immagine: quella fissata dal chart (kubectlImage). Nome del bridge:
  # trovato per etichetta (app.kubernetes.io/component=jvb).
  jvbDeploymentName: ""

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Limiti veri di ingress-nginx: i nomi `rate-limit`/`rate-limit-window`
    # che stavano qui non esistono e non facevano nulla. Il valore va tarato
    # sul traffico reale prima di alzarlo a protezione: la sala in diretta
    # apre più connessioni per partecipante.
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: videocall.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: videocall-tls
      hosts:
        - videocall.example.com

# Prometheus monitoring
metrics:
  serviceMonitor:
    enabled: true
    interval: 15s
    additionalLabels:
      release: prometheus
