# ─────────────────────────────────────────────────────────────
# pa-webinar — Development / Staging overrides
#
# Usage:
#   helm install videocall ./infra/helm/pa-webinar \
#     -f values.yaml -f values-dev.yaml -n <namespace> \
#     --set jitsi-meet.prosody.jwt.secret=$JITSI_JWT_SECRET
#
# The conference needs the same secret as JITSI_JWT_SECRET in the
# application Secret to verify its tokens: pass it as above, or name a
# Secret with the single key JWT_APP_SECRET in
# jitsi-meet.prosody.jwt.existingSecretName (never both: the chart refuses
# to render when both are set).
# ─────────────────────────────────────────────────────────────

app:
  replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

postgresql:
  enabled: true
  primary:
    persistence:
      size: 5Gi
      storageClass: ""

jitsi:
  enabled: true
