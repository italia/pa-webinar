{{- if eq .Values.secrets.mode "external" }}
{{- $fullname := include "pa-webinar.fullname" . -}}
{{- $secretName := .Values.secrets.existingSecretName | default "videocall-secrets" -}}
{{- $ext := .Values.secrets.external -}}
{{- $provider := $ext.provider -}}
{{- $refreshInterval := $ext.refreshInterval | default "1h" -}}
{{- $api := include "pa-webinar.externalSecretsApiVersion" . -}}
{{- $mappings := dict -}}
{{- if eq $provider "azure-key-vault" }}
{{- $mappings = $ext.azureKeyVault.secretMappings | default dict }}
{{- else if eq $provider "aws-secrets-manager" }}
{{- $mappings = $ext.awsSecretsManager.secretMappings | default dict }}
{{- else if eq $provider "gcp-secret-manager" }}
{{- $mappings = $ext.gcpSecretManager.secretMappings | default dict }}
{{- end }}
{{- if has $provider (list "azure-key-vault" "aws-secrets-manager" "gcp-secret-manager") }}
apiVersion: {{ $api }}
kind: SecretStore
metadata:
  name: {{ $fullname }}-vault
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
spec:
  provider:
    {{- if eq $provider "azure-key-vault" }}
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ $ext.azureKeyVault.vaultUrl | quote }}
      tenantId: {{ $ext.azureKeyVault.tenantId | quote }}
      serviceAccountRef:
        name: {{ include "pa-webinar.serviceAccountName" . }}
    {{- else if eq $provider "aws-secrets-manager" }}
    aws:
      service: SecretsManager
      region: {{ $ext.awsSecretsManager.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "pa-webinar.serviceAccountName" . }}
    {{- else }}
    gcpsm:
      projectID: {{ $ext.gcpSecretManager.projectID | quote }}
      auth:
        workloadIdentity:
          {{- /* Vuoti = l'operatore li ricava dal metadata server di GKE. */}}
          {{- with $ext.gcpSecretManager.clusterLocation }}
          clusterLocation: {{ . | quote }}
          {{- end }}
          {{- with $ext.gcpSecretManager.clusterName }}
          clusterName: {{ . | quote }}
          {{- end }}
          serviceAccountRef:
            name: {{ include "pa-webinar.serviceAccountName" . }}
    {{- end }}
---
apiVersion: {{ $api }}
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-secrets
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $refreshInterval }}
  secretStoreRef:
    name: {{ $fullname }}-vault
    kind: SecretStore
  target:
    name: {{ $secretName }}
    creationPolicy: Owner
  data:
    {{- range $k8sKey, $remoteKey := $mappings }}
    - secretKey: {{ $k8sKey }}
      remoteRef:
        key: {{ $remoteKey }}
    {{- end }}
{{- /*
  Il segreto con cui Prosody verifica i token, in un Secret a parte con la sola
  chiave JWT_APP_SECRET: viene dalla stessa voce remota di JITSI_JWT_SECRET,
  cosi' i due valori non possono divergere quando se ne ruota uno.
*/}}
{{- with .Values.secrets.jitsiJwtSecretName }}
---
apiVersion: {{ $api }}
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-jitsi-jwt
  labels:
    {{- include "pa-webinar.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $refreshInterval }}
  secretStoreRef:
    name: {{ $fullname }}-vault
    kind: SecretStore
  target:
    name: {{ . }}
    creationPolicy: Owner
  data:
    - secretKey: JWT_APP_SECRET
      remoteRef:
        key: {{ required (printf "secrets.jitsiJwtSecretName è valorizzato ma secrets.external non ha una voce per JITSI_JWT_SECRET nelle secretMappings del provider %q: il Secret della conferenza resterebbe vuoto." $provider) (index $mappings "JITSI_JWT_SECRET") }}
{{- end }}
{{- end }}
{{- end }}
