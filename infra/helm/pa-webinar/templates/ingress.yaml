{{- if .Values.ingress.enabled }}
{{- /*
  Le annotazioni `nginx.ingress.kubernetes.io/*` si tolgono solo quando la
  classe e' quella di un controller che non e' ingress-nginx
  (`ingress.nonNginxClassNames`), dove verrebbero ignorate. Con qualunque
  altra classe, o senza classe, restano: una classe di ingress-nginx con un
  nome personalizzato non si riconosce dal nome, e togliere `proxy-body-size`
  riporterebbe il limite delle richieste a 1 MB senza avviso.
*/}}
{{- $classe := toString (.Values.ingress.className | default "") }}
{{- $altroController := has $classe (.Values.ingress.nonNginxClassNames | default list) }}
{{- $annotations := dict }}
{{- range $chiave, $valore := (.Values.ingress.annotations | default dict) }}
{{- /* Una chiave a null senza valore predefinito arriva fin qui: vuol dire "toglila". */}}
{{- if not (or (kindIs "invalid" $valore) (and $altroController (hasPrefix "nginx.ingress.kubernetes.io/" $chiave))) }}
{{- $_ := set $annotations $chiave $valore }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pa-webinar.fullname" . }}
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "pa-webinar.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
