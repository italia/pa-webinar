{{- if and .Values.postprod.enabled .Values.postprod.orchestrator.enabled }}
# Postprod orchestrator — runs every minute, queries the app for the
# number of runnable jobs and creates as many one-shot worker Jobs on
# the GPU node pool. Mirrors `cronjob-jvb-scaler.yaml` in spirit
# (application-driven scaling) but produces Jobs instead of `kubectl
# scale` calls because the worker is one-shot, not a long-lived
# Deployment.
#
# No KEDA, no Argo: just kubectl + a small shell script. The app is
# the source of truth for the queue (Postgres outbox pattern); the
# orchestrator never reads the DB directly.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pa-webinar.fullname" . }}-postprod-orchestrator
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
    app.kubernetes.io/component: cronjob-postprod-orchestrator
spec:
  schedule: {{ .Values.postprod.orchestrator.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # GC dei Job terminati (successo E fallimento): senza TTL un Job fallito
      # resta visibile per giorni (failedJobsHistoryLimit) e tiene acceso
      # KubeJobFailed molto oltre il problema reale.
      ttlSecondsAfterFinished: {{ .Values.cronjobs.jobTtlSeconds | default 7200 }}
      # 240s: il lavoro vero dura secondi, ma la deadline parte dalla creazione
      # del Job e comprende l'attesa di schedulazione e il pull dell'immagine su
      # un nodo nuovo del pool applications, che scala fra 0 e 10. Con i valori
      # precedenti erano 149 fallimenti DeadlineExceeded in quattordici giorni su
      # endpoint sani, cioe' una decina di allarmi falsi al giorno.
      # concurrencyPolicy: Forbid resta la guardia contro l'accumulo: una run
      # lunga fa saltare i tick successivi, non li accoda.
      activeDeadlineSeconds: 240
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "pa-webinar.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cronjob-postprod-orchestrator
        spec:
          serviceAccountName: {{ include "pa-webinar.fullname" . }}-postprod-orchestrator
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          {{- if .Values.app.nodeSelector }}
          nodeSelector:
            {{- toYaml .Values.app.nodeSelector | nindent 12 }}
          {{- end }}
          {{- if .Values.app.tolerations }}
          tolerations:
            {{- toYaml .Values.app.tolerations | nindent 12 }}
          {{- end }}
          containers:
            - name: orchestrator
              image: {{ .Values.postprod.orchestrator.image | default .Values.kubectlImage }}
              command:
                - /bin/sh
                - -c
                - |
                  log() { echo "[$(date -u '+%Y-%m-%d %H:%M:%S')] postprod-orchestrator: $1"; }

                  APP_URL="{{ include "pa-webinar.internalUrl" . }}"
                  NS="{{ .Release.Namespace }}"
                  WORKER_TPL="{{ include "pa-webinar.fullname" . }}-postprod-worker"
                  CPU_WORKER_TPL="{{ include "pa-webinar.fullname" . }}-postprod-worker-cpu"

                  # ── 1. Query desired count from the app ──────────
                  RESPONSE=$(curl -sf {{ include "pa-webinar.cronCurlRetry" . }} \
                    -H "x-api-key: $CRON_API_KEY" \
                    "${APP_URL}/api/internal/postprod-pending" 2>/dev/null || true)
                  if [ -z "$RESPONSE" ]; then
                    log "ERROR: empty response from /postprod-pending"
                    exit 0
                  fi
                  log "API response: $RESPONSE"

                  ENABLED=$(echo "$RESPONSE" | grep -o '"pipelineEnabled":\(true\|false\)' | grep -o 'true\|false')
                  DESIRED=$(echo "$RESPONSE" | grep -o '"desired":[0-9]*' | grep -o '[0-9]*' || echo "0")
                  RUNNABLE=$(echo "$RESPONSE" | grep -o '"runnable":[0-9]*' | grep -o '[0-9]*' || echo "0")
                  # Le due misure per worker con e senza GPU; un'app che non le
                  # manda vale come «tutto al worker con la GPU».
                  DESIRED_GPU=$(echo "$RESPONSE" | grep -o '"desiredGpu":[0-9]*' | grep -o '[0-9]*' || true)
                  DESIRED_CPU=$(echo "$RESPONSE" | grep -o '"desiredCpu":[0-9]*' | grep -o '[0-9]*' || true)
                  [ -z "$DESIRED_GPU" ] && DESIRED_GPU=$DESIRED
                  [ -z "$DESIRED_CPU" ] && DESIRED_CPU=0
                  # Quale motore serve: i lavori che usano vLLM e quelli del
                  # motore di traduzione su CPU, compresi quelli in esecuzione.
                  # Un'app che non li manda: vLLM come prima, motore spento.
                  DESIRED_LLM=$(echo "$RESPONSE" | grep -o '"desiredLlm":[0-9]*' | grep -o '[0-9]*' || true)
                  DESIRED_MT=$(echo "$RESPONSE" | grep -o '"desiredMt":[0-9]*' | grep -o '[0-9]*' || true)
                  [ -z "$DESIRED_MT" ] && DESIRED_MT=0
{{- if include "pa-webinar.mtScaled" . }}

                  # ── 1a. Motore di traduzione su CPU on-demand ────
                  # Una replica mentre c'e' una traduzione dei testi in coda o
                  # in corso; a zero dopo postprod.mt.scaleToZero.idleMinutes
                  # senza lavoro, contati dall'annotazione che l'orchestratore
                  # aggiorna a ogni giro con lavoro. Anche a pipeline spenta:
                  # il motore occupa CPU e memoria sui nodi dell'app.
                  MT_DEPLOY="{{ include "pa-webinar.mtName" . }}"
                  MT_IDLE_S={{ mul (int .Values.postprod.mt.scaleToZero.idleMinutes) 60 }}
                  MT_HAVE=$(kubectl get deploy -n "$NS" "$MT_DEPLOY" \
                    -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "")
                  if [ -n "$MT_HAVE" ]; then
                    ORA=$(date +%s)
                    if [ "$ENABLED" = "true" ] && [ "$DESIRED_MT" -gt 0 ]; then
                      MT_WANT=1
                      kubectl annotate deploy -n "$NS" "$MT_DEPLOY" --overwrite \
                        "pa-webinar/mt-last-busy=$ORA" >/dev/null 2>&1 || true
                    else
                      ULTIMO=$(kubectl get deploy -n "$NS" "$MT_DEPLOY" \
                        -o jsonpath='{.metadata.annotations.pa-webinar/mt-last-busy}' 2>/dev/null || echo "")
                      case "$ULTIMO" in ''|*[!0-9]*) ULTIMO=0 ;; esac
                      if [ $((ORA - ULTIMO)) -lt "$MT_IDLE_S" ]; then
                        MT_WANT=$MT_HAVE
                      else
                        MT_WANT=0
                      fi
                    fi
                    if [ "$MT_HAVE" != "$MT_WANT" ]; then
                      log "mt $MT_DEPLOY: scaling $MT_HAVE -> $MT_WANT"
                      kubectl scale deploy -n "$NS" "$MT_DEPLOY" --replicas="$MT_WANT" || true
                    fi
                  fi
{{- end }}

                  if [ "$ENABLED" != "true" ]; then
                    log "pipeline disabled — nothing to do"
                    exit 0
                  fi

                  # ── 2. How many workers are currently active? ────
                  # `status.active` su Job conta i pod NON ancora
                  # completati (Pending + Running). Estratto via
                  # jsonpath invece che regex perché `kubectl -o json`
                  # produce pretty-print con spazio dopo i `:` e la
                  # vecchia regex `"active":[1-9][0-9]*` falliva il
                  # match — risultato: l'orchestrator vedeva
                  # ACTIVE=0 ogni tick e creava un worker in più ogni
                  # minuto finché GPU non disponibile.
                  active_of() {
                    kubectl get jobs -n "$NS" \
                      -l "app.kubernetes.io/component=$1" \
                      -o jsonpath='{range .items[*]}{.status.active}{"\n"}{end}' 2>/dev/null \
                      | awk 'NF{s+=$1} END {print s+0}'
                  }
                  ACTIVE_GPU=$(active_of postprod-worker)
                  ACTIVE_GPU=${ACTIVE_GPU:-0}
{{- if (.Values.postprod.worker.cpu | default dict).enabled }}
                  ACTIVE_CPU=$(active_of postprod-worker-cpu)
                  ACTIVE_CPU=${ACTIVE_CPU:-0}
{{- else }}
                  # Senza worker CPU il worker con la GPU fa tutto.
                  ACTIVE_CPU=0
                  DESIRED_GPU=$DESIRED
                  DESIRED_CPU=0
{{- end }}
                  ACTIVE=$((ACTIVE_GPU + ACTIVE_CPU))
                  log "active workers gpu=$ACTIVE_GPU cpu=$ACTIVE_CPU desired gpu=$DESIRED_GPU cpu=$DESIRED_CPU runnable=$RUNNABLE llm=${DESIRED_LLM:-?} mt=$DESIRED_MT"
{{- if .Values.postprod.vllm.autoscale }}

                  # ── 1b. vLLM on-demand ───────────────────────────
                  # vLLM e' un Deployment GPU persistente: lasciarlo a
                  # replicas=1 tiene acceso l'A100 (~3.40 EUR/h) anche a
                  # vuoto e vanifica lo scale-to-zero del pool. Lo
                  # accendiamo solo quando c'e' lavoro che lo usa
                  # (desiredLlm: trascrizione, sintesi, traduzioni,
                  # resoconto; non doppiaggio, archivio ne' traduzione dei
                  # testi) e lo spegniamo quando non ce n'e'. Con un'app che
                  # non manda desiredLlm, come prima: lavoro in coda o worker
                  # ancora attivi.
                  # Idempotente: scala solo se serve. Se il Deployment non
                  # esiste (vLLM non deployato) non fa nulla.
                  VLLM_DEPLOY="{{ .Values.postprod.vllm.deploymentName | default (printf "%s-vllm" (include "pa-webinar.fullname" .)) }}"
                  if [ -n "$DESIRED_LLM" ]; then
                    if [ "$DESIRED_LLM" -gt 0 ]; then VLLM_WANT=1; else VLLM_WANT=0; fi
                  elif [ "$DESIRED" -gt 0 ] || [ "$ACTIVE" -gt 0 ]; then
                    VLLM_WANT=1
                  else
                    VLLM_WANT=0
                  fi
                  VLLM_HAVE=$(kubectl get deploy -n "$NS" "$VLLM_DEPLOY" \
                    -o jsonpath='{.spec.replicas}' 2>/dev/null || echo "")
                  if [ -n "$VLLM_HAVE" ] && [ "$VLLM_HAVE" != "$VLLM_WANT" ]; then
                    log "vLLM $VLLM_DEPLOY: scaling $VLLM_HAVE -> $VLLM_WANT"
                    kubectl scale deploy -n "$NS" "$VLLM_DEPLOY" --replicas="$VLLM_WANT" || true
                  fi
{{- end }}

                  # ── 3. Spawn worker Jobs from the templates ──────
                  # The templates live as CronJobs (suspended) in the
                  # cluster so we can use `kubectl create job
                  # --from=cronjob/...`. This gives us nodeSelector +
                  # tolerations + resource limits for free.
                  spawn() {
                    TPL="$1"; N="$2"
                    for i in $(seq 1 "$N"); do
                      JOB_NAME="${TPL}-$(date -u +%s)-$i"
                      log "creating worker job: $JOB_NAME"
                      kubectl create job -n "$NS" "$JOB_NAME" \
                        --from=cronjob/"$TPL" \
                        || log "failed to create $JOB_NAME"
                    done
                  }
                  NEEDED_GPU=$((DESIRED_GPU - ACTIVE_GPU))
                  NEEDED_CPU=$((DESIRED_CPU - ACTIVE_CPU))
                  if [ "$NEEDED_GPU" -le 0 ] && [ "$NEEDED_CPU" -le 0 ]; then
                    log "no new workers needed"
                    exit 0
                  fi
                  [ "$NEEDED_GPU" -gt 0 ] && spawn "$WORKER_TPL" "$NEEDED_GPU"
                  [ "$NEEDED_CPU" -gt 0 ] && spawn "$CPU_WORKER_TPL" "$NEEDED_CPU"
                  exit 0
              env:
                - name: CRON_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "pa-webinar.secretName" . }}
                      key: CRON_API_KEY
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1001
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pa-webinar.fullname" . }}-postprod-orchestrator
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
    app.kubernetes.io/component: postprod-orchestrator
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "pa-webinar.fullname" . }}-postprod-orchestrator
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
    app.kubernetes.io/component: postprod-orchestrator
rules:
  # Read the worker template CronJob to create Jobs from it.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
{{- if .Values.postprod.vllm.autoscale }}
  # vLLM on-demand: l'orchestrator scala il Deployment vLLM su/giu'
  # in base al carico (vedi sezione 1b dello script).
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update", "patch"]
{{- end }}
{{- if include "pa-webinar.mtScaled" . }}
  # Motore di traduzione su CPU on-demand (sezione 1a dello script): solo il
  # suo Deployment, letto, annotato con l'ultimo lavoro e scalato.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "pa-webinar.mtName" . | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: [{{ include "pa-webinar.mtName" . | quote }}]
    verbs: ["get", "update", "patch"]
{{- end }}
  # No access to pods / exec / secrets — workers receive secrets via
  # envFrom in their own podSpec, not through the orchestrator.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "pa-webinar.fullname" . }}-postprod-orchestrator
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
    app.kubernetes.io/component: postprod-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "pa-webinar.fullname" . }}-postprod-orchestrator
subjects:
  - kind: ServiceAccount
    name: {{ include "pa-webinar.fullname" . }}-postprod-orchestrator
    namespace: {{ .Release.Namespace }}
{{- end }}
