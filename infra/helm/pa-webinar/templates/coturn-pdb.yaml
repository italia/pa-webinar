{{- if .Values.coturnPodDisruptionBudget.enabled }}
{{- if index .Values "jitsi-meet" "coturn" "enabled" }}
# PodDisruptionBudget per coturn (media relay TURN/TURNS del subchart jitsi-meet).
# Il subchart non espone un PDB: lo aggiungiamo qui selezionando i pod coturn per label.
# Protegge lo SPOF del media plane da disruption volontarie (node drain / eviction API)
# mentre gli eventi sono in corso. Vedi values.yaml -> coturnPodDisruptionBudget.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "pa-webinar.fullname" . }}-coturn
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
    app.kubernetes.io/component: coturn
spec:
  {{- if .Values.coturnPodDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.coturnPodDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.coturnPodDisruptionBudget.minAvailable }}
  {{- end }}
  # Un pod non Ready non serve traffico: lasciarlo evacuare non toglie
  # disponibilita` e rompe il circolo vizioso del drain, in cui il primo pod
  # spostato fa scendere currentHealthy, porta disruptionsAllowed a 0 e da li`
  # in poi blocca sia il drain sia lo scale-down dell'autoscaler. I pod sani
  # restano protetti da minAvailable/maxUnavailable come prima.
  unhealthyPodEvictionPolicy: {{ .Values.coturnPodDisruptionBudget.unhealthyPodEvictionPolicy }}
  selector:
    matchLabels:
      app.kubernetes.io/name: jitsi-meet
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: coturn
{{- end }}
{{- end }}
