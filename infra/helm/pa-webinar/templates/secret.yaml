{{/*
Secrets management — three modes:

  "existing"  — reference a pre-created Kubernetes Secret (default)
                No resources generated. The user must create the Secret manually.
  "external"  — use External Secrets Operator (Azure Key Vault, AWS SM, GCP SM)
                See external-secret.yaml template.
  "generate"  — chart creates Secret from values (dev/test ONLY, never production)
                See below.

Required Secret keys:
  DATABASE_URL, JITSI_JWT_SECRET, JITSI_JWT_APP_ID, JITSI_JWT_ISSUER,
  JITSI_JWT_AUDIENCE, APP_SECRET, ADMIN_API_KEY, PII_ENCRYPTION_KEY,
  CRON_API_KEY, SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER,
  SMTP_PASSWORD, SMTP_FROM, SMTP_FROM_NAME

Optional:
  REDIS_URL — only when the redis subchart is DISABLED (external/managed
              Redis). With the subchart enabled the Deployment derives the
              in-cluster address itself and that value wins, because a `env`
              entry takes precedence over `envFrom`.

The passwords of the in-cluster datastores live in a SEPARATE Secret, named by
`secrets.datastoreSecretName`, and never in this one: the PostgreSQL subchart
mounts its password Secret whole, as files, inside the database container. Any
key kept next to those passwords — the encryption key of the personal data
first of all — would be readable by anyone who reaches that container.

  Datastore Secret keys: POSTGRES_PASSWORD, POSTGRES_ADMIN_PASSWORD (if the
  postgresql subchart is enabled), REDIS_PASSWORD (if the redis subchart is).

Storage (set one per domain, or reuse the same bucket with both):

  Files domain (event materials):
    AZURE_STORAGE_CONNECTION_STRING    — Azure Blob
    STORAGE_FILES_S3_ACCESS_KEY_ID     — S3 / MinIO / GCS / R2 / PSN
    STORAGE_FILES_S3_SECRET_ACCESS_KEY

  Recordings domain (Jibri + manual uploads):
    RECORDING_AZURE_CONNECTION_STRING  — Azure Blob
    RECORDING_S3_ACCESS_KEY_ID         — S3 / MinIO / GCS / R2 / PSN
    RECORDING_S3_SECRET_ACCESS_KEY

  Provider auto-detected from which env vars are present; override with
  STORAGE_FILES_PROVIDER or RECORDING_STORAGE_TYPE. Non-sensitive hints
  (bucket, region, endpoint, force-path-style) go in the ConfigMap.
*/}}
{{- if eq .Values.secrets.mode "generate" }}
{{- $name := include "pa-webinar.secretName" . }}
{{- $gen := .Values.secrets.generate | default dict }}
{{- $pgEnabled := dig "enabled" false (.Values.postgresql | default dict) }}
{{- $redisEnabled := dig "enabled" false (.Values.redis | default dict) }}
{{- $datastoreName := include "pa-webinar.datastoreSecretName" . }}
{{- $separato := ne $datastoreName $name }}

{{/*
  Le password dei datastore si passano, non si inventano: il contenuto reso
  deve restare una funzione dei soli valori. Un template che genera una
  password a caso quando non ne trova una produce credenziali diverse a ogni
  resa — e chi riconcilia con `helm template` (Argo CD, Flux) riscriverebbe il
  Secret a ogni giro, mentre il database tiene quella scritta al primo avvio.
  Il guasto arriverebbe più tardi, al primo riavvio del pod, sotto forma di
  autenticazione rifiutata.
*/}}
{{/*
  Si accetta anche la via storica — la password nei valori del sottochart —
  perché è quella che i profili di esempio hanno documentato a lungo: chi ha
  costruito i propri valori così deve poter aggiornare senza che la resa si
  interrompa. L'ordine è: valore esplicito qui, poi quello del sottochart.
*/}}
{{- $pgPassword := $gen.POSTGRES_PASSWORD | default (dig "auth" "password" "" (.Values.postgresql | default dict)) }}
{{- $pgAdminPassword := $gen.POSTGRES_ADMIN_PASSWORD | default (dig "auth" "postgresPassword" "" (.Values.postgresql | default dict)) }}
{{- $redisPassword := $gen.REDIS_PASSWORD | default (dig "auth" "password" "" (.Values.redis | default dict)) }}
{{- if and $pgEnabled (not $pgPassword) }}
{{- fail "Serve una password per il PostgreSQL in cluster: valorizza secrets.generate.POSTGRES_PASSWORD (o postgresql.auth.password). Generala con `openssl rand -hex 24` e CONSERVALA: è quella con cui il database viene inizializzato, e non è più ricavabile da nessuna parte." }}
{{- end }}
{{- if and $pgEnabled (not $pgAdminPassword) }}
{{- fail "Serve una password di amministrazione per il PostgreSQL in cluster: valorizza secrets.generate.POSTGRES_ADMIN_PASSWORD (o postgresql.auth.postgresPassword)." }}
{{- end }}
{{- if and $redisEnabled (not $redisPassword) }}
{{- fail "Serve una password per il Redis in cluster: valorizza secrets.generate.REDIS_PASSWORD (o redis.auth.password). Con l'autenticazione attiva Redis non parte senza." }}
{{- end }}

{{/*
  Indirizzo del database. Derivato dal Service del sottochart quando gira in
  cluster, altrimenti va passato per intero. Una password scritta a mano deve
  essere sicura in una URL: finisce lì dentro così com'è.
*/}}
{{- $databaseUrl := $gen.DATABASE_URL | default "" }}
{{- if and (not $databaseUrl) $pgEnabled }}
{{- $pg := .Values.postgresql | default dict }}
{{/*
  I default si scrivono con `default`, non con il terzo argomento di `dig`:
  il sottochart dichiara queste chiavi con valore vuoto, quindi esistono
  sempre e `dig` restituisce "" invece del fallback. Lo stesso vale per
  `nameOverride` qui sotto, dove l'effetto era un host di database sbagliato.
*/}}
{{- $pgUser := default "eventi" (dig "auth" "username" "" $pg) }}
{{- $pgDatabase := default "pa_webinar" (dig "auth" "database" "" $pg) }}
{{/*
  Nome del Service del sottochart. Va riprodotto come lo calcola il sottochart
  stesso (`common.names.fullname`), override compresi: scriverlo a mano
  funziona solo finché nessuno li usa, e un host sbagliato non si manifesta
  come errore di resa ma come pod che non parte, senza indizi sul valore
  calcolato.
*/}}
{{- $pgHost := include "pa-webinar.subchartFullname" (dict "nome" "postgresql" "valori" $pg "release" .Release.Name) }}
{{/*
  Anche la porta e' configurabile sul sottochart: fissarla a 5432 produce un
  Secret che punta a una porta chiusa per chi la cambia.
*/}}
{{- $pgPort := dig "primary" "service" "ports" "postgresql" 5432 $pg }}
{{/*
  La password va codificata: una password con `@`, `/`, `#` o `:` spezza
  l'indirizzo, e il guasto si presenta come credenziali errate. `urlquery`
  codifica però lo spazio come `+`, che nella parte di autenticazione di una
  URL è un `+` letterale e non uno spazio: lì va `%20`.
*/}}
{{- $databaseUrl = printf "postgresql://%s:%s@%s:%v/%s" (urlquery $pgUser | replace "+" "%20") (urlquery $pgPassword | replace "+" "%20") $pgHost $pgPort $pgDatabase }}
{{- end }}
{{/*
  Senza indirizzo del database l'applicazione non parte. Meglio fermarsi in
  resa che rendere un Secret con la chiave vuota, che supera i controlli di
  presenza e fallisce all'avvio del pod.
*/}}
{{- if not $databaseUrl }}
{{- fail "Serve l'indirizzo della banca dati: con il sottochart PostgreSQL spento va passato per intero in secrets.generate.DATABASE_URL (postgresql://utente:password@host:5432/nome)." }}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook-weight: "-5"
type: Opaque
stringData:
  {{- range $key, $value := $gen }}
  {{/*
    REDIS_URL resta fuori quando il sottochart è attivo: il Deployment imposta
    quella variabile come `env`, che vince su `envFrom`, quindi un valore qui
    non arriverebbe mai all'applicazione e sembrerebbe soltanto che sia stato
    preso in considerazione. Per un Redis gestito si spegne il sottochart.
  */}}
  {{- if not (has $key (list "DATABASE_URL" "POSTGRES_PASSWORD" "POSTGRES_ADMIN_PASSWORD" "REDIS_PASSWORD")) }}
  {{- if not (and $redisEnabled (eq $key "REDIS_URL")) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  DATABASE_URL: {{ $databaseUrl | quote }}
  {{- if not $separato }}
  {{/*
    Nessun Secret dedicato: le password restano qui, che è la disposizione
    delle installazioni esistenti. Vedi secrets.datastoreSecretName per
    separarle — il sottochart PostgreSQL monta per intero, come file dentro
    il proprio container, il Secret da cui legge la password.
  */}}
  {{- if $pgEnabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  POSTGRES_ADMIN_PASSWORD: {{ $pgAdminPassword | quote }}
  {{- end }}
  {{- if $redisEnabled }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  {{- end }}
  {{- end }}
{{- if and $separato (or $pgEnabled $redisEnabled) }}
---
{{/*
  Secret dedicato ai datastore in cluster, così che le chiavi
  dell'applicazione non finiscano montate dentro il container del database.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $datastoreName }}
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook-weight: "-6"
type: Opaque
stringData:
  {{- if $pgEnabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  POSTGRES_ADMIN_PASSWORD: {{ $pgAdminPassword | quote }}
  {{- end }}
  {{- if $redisEnabled }}
  REDIS_PASSWORD: {{ $redisPassword | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- /*
  Il segreto con cui Prosody verifica i token della conferenza: lo stesso
  valore di JITSI_JWT_SECRET, in un Secret a parte perche' il sottochart lo
  carica per intero nell'ambiente di Prosody, e li' non devono finire le
  altre chiavi dell'applicazione. In modalita' "external" lo stesso Secret lo
  produce external-secret.yaml.
*/}}
{{- if and (eq .Values.secrets.mode "generate") .Values.secrets.jitsiJwtSecretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.jitsiJwtSecretName }}
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_APP_SECRET: {{ required "secrets.generate.JITSI_JWT_SECRET è obbligatorio: è il segreto con cui la conferenza verifica i token dell'applicazione" (.Values.secrets.generate | default dict).JITSI_JWT_SECRET | quote }}
{{- end }}
