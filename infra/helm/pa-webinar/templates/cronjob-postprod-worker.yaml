# Worker template — this CronJob is created **suspended** and used as
# a Pod spec template by the postprod-orchestrator (`kubectl create
# job --from=cronjob/...`). It's never executed on its own schedule.
# The "@yearly" schedule is a never-fires placeholder; we also set
# suspend=true so even that one tick is skipped.
{{- /*
  Il worker di post-produzione, come modello di Pod per l'orchestratore.
  Si rende in due varianti (vedi in fondo):
  - `postprod-worker`: con la GPU, per la trascrizione (WhisperX, pyannote)
    e il doppiaggio (la filigrana AudioSeal chiede molta memoria);
  - `postprod-worker-cpu` (postprod.worker.cpu.enabled): senza GPU, per
    sintesi e traduzioni (il testo lo produce vLLM, sulla sua GPU) e archivio.
    Per una sintesi si accende cosi' una sola A100. Ha un'immagine sua,
    leggera (infra/ai/Dockerfile.worker-cpu): quella del worker con la GPU
    pesa ~15 GB e si scaricherebbe su ogni nodo dell'app che lo ospita.
  Senza la variante CPU, il worker con la GPU prende ogni tipo di job. Gli
  elenchi dei tipi sono quelli di app/src/lib/ai/job-classes.ts. La variante
  CPU parte da `worker.cpu`, che un'immagine del worker precedente a questa
  separazione non ha: il pod termina senza prendere job. Variabili
  (`extraEnv`) e token di Hugging Face sono per variante: quelle del worker
  con la GPU non arrivano a quello senza.
*/ -}}
{{- define "pa-webinar.postprodWorker" -}}
{{- $v := .v -}}
{{- with .root }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "pa-webinar.fullname" . }}-{{ $v.component }}
  labels:
    {{- include "pa-webinar.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $v.component }}
spec:
  schedule: "@yearly"
  suspend: true
  jobTemplate:
    metadata:
      labels:
        {{- include "pa-webinar.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $v.component }}
    spec:
      # One Pod per job, no retries inside the Job (the queue retries
      # via PostprodJob.attempts).
      backoffLimit: 0
      {{- include "pa-webinar.disruptionTolerantFailurePolicy" . | nindent 6 }}
      activeDeadlineSeconds: {{ .Values.postprod.worker.activeDeadlineSeconds | default 3600 }}
      ttlSecondsAfterFinished: {{ .Values.postprod.worker.ttlSecondsAfterFinished | default 600 }}
      template:
        metadata:
          labels:
            {{- include "pa-webinar.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: {{ $v.component }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          # The worker runs on a scale-from-zero GPU node where the (private)
          # worker image is never cached, so it MUST present pull credentials —
          # unlike the orchestrator/reclaim/retention cronjobs which reuse the
          # app image already cached on the app nodes. Inherit the app's pull
          # secret unless a worker-specific one is set.
          {{- with (.Values.postprod.worker.imagePullSecrets | default .Values.app.imagePullSecrets) }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $v.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $v.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $v.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          volumes:
            {{- if $v.models }}
            {{- if .Values.postprod.worker.modelsPvc }}
            - name: models
              persistentVolumeClaim:
                claimName: {{ .Values.postprod.worker.modelsPvc }}
            {{- else }}
            - name: models
              emptyDir:
                sizeLimit: {{ .Values.postprod.worker.modelsSizeLimit | default "30Gi" }}
            {{- end }}
            {{- end }}
            - name: work
              emptyDir:
                sizeLimit: {{ .Values.postprod.worker.workSizeLimit | default "20Gi" }}
          containers:
            - name: worker
              image: {{ $v.image }}
              imagePullPolicy: {{ .Values.postprod.worker.imagePullPolicy | default "IfNotPresent" }}
              {{- with $v.args }}
              args:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              env:
                - name: APP_INTERNAL_URL
                  value: {{ include "pa-webinar.internalUrl" . | quote }}
                # The container runs read-only / non-root, so /tmp isn't
                # writable: Python's tempfile would raise "No usable
                # temporary directory". Point TMPDIR at the writable
                # scratch emptyDir mounted at /work (where the worker
                # downloads the source MP4 and stages artifacts anyway).
                - name: TMPDIR
                  value: /work
                # La scadenza del Job, per i passi che si regolano sul tempo
                # rimasto (la correzione della trascrizione).
                - name: WORKER_DEADLINE_S
                  value: {{ .Values.postprod.worker.activeDeadlineSeconds | default 3600 | quote }}
                - name: CRON_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "pa-webinar.secretName" . }}
                      key: CRON_API_KEY
                # Pyannote gated model needs the HF token. The Secret
                # must exist before this rolls out (see docs/POSTPROD.md).
                {{- if and $v.models .Values.postprod.worker.hfTokenSecret }}
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postprod.worker.hfTokenSecret.name }}
                      key: {{ .Values.postprod.worker.hfTokenSecret.key | default "HF_TOKEN" }}
                {{- end }}
                {{- if .Values.postprod.worker.stub }}
                - name: WORKER_STUB
                  value: "1"
                {{- end }}
                {{- with $v.kinds }}
                # I tipi di job che questo worker prende (lib/ai/job-classes).
                - name: AI_WORKER_KINDS
                  value: {{ join "," . | quote }}
                {{- end }}
                {{- range $key, $value := $v.extraEnv }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              volumeMounts:
                {{- if $v.models }}
                - name: models
                  mountPath: /models
                {{- end }}
                - name: work
                  mountPath: /work
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: {{ $v.resources.requests.cpu | quote }}
                  memory: {{ $v.resources.requests.memory | quote }}
                  {{- if $v.gpu }}
                  nvidia.com/gpu: {{ .Values.postprod.worker.gpu.count | default 1 }}
                  {{- end }}
                limits:
                  cpu: {{ $v.resources.limits.cpu | quote }}
                  memory: {{ $v.resources.limits.memory | quote }}
                  {{- if $v.gpu }}
                  nvidia.com/gpu: {{ .Values.postprod.worker.gpu.count | default 1 }}
                  {{- end }}
{{- end }}
{{- end -}}

{{- if and .Values.postprod.enabled .Values.postprod.worker.enabled }}
{{- $w := .Values.postprod.worker }}
{{- $cpu := $w.cpu | default dict }}
{{- $gpuRes := dict "requests" (dict "cpu" ($w.resources.requests.cpu | default "2") "memory" ($w.resources.requests.memory | default "16Gi")) "limits" (dict "cpu" ($w.resources.limits.cpu | default "8") "memory" ($w.resources.limits.memory | default "48Gi")) }}
{{- $gpuKinds := list }}
{{- if $cpu.enabled }}
{{- $gpuKinds = list "TRANSCRIBE" "TRANSCRIBE_MULTITRACK" "DUB" }}
{{- end }}
{{ include "pa-webinar.postprodWorker" (dict "root" . "v" (dict "component" "postprod-worker" "gpu" $w.gpu.enabled "nodeSelector" $w.nodeSelector "tolerations" $w.tolerations "affinity" $w.affinity "resources" $gpuRes "kinds" $gpuKinds "models" true "extraEnv" ($w.extraEnv | default dict) "image" (include "pa-webinar.auxImage" (list . $w.image "postprod-worker")))) }}
{{- if $cpu.enabled }}
{{- $cr := $cpu.resources | default dict }}
{{- $creq := $cr.requests | default dict }}
{{- $clim := $cr.limits | default dict }}
{{- $cpuRes := dict "requests" (dict "cpu" ($creq.cpu | default "1") "memory" ($creq.memory | default "3Gi")) "limits" (dict "cpu" ($clim.cpu | default "4") "memory" ($clim.memory | default "8Gi")) }}
{{- /* L'immagine leggera: quella indicata, oppure, se l'installazione ha
       fissato l'immagine del worker (registro proprio, digest, una release
       senza immagine leggera), quella stessa, che contiene anche worker.cpu:
       pesante, ma esiste. Altrimenti <repository dell'app>-postprod-worker-cpu
       col tag dell'app. */}}
{{- $cpuImage := $cpu.image | default $w.image | default (include "pa-webinar.auxImage" (list . "" "postprod-worker-cpu")) }}
---
{{ include "pa-webinar.postprodWorker" (dict "root" . "v" (dict "component" "postprod-worker-cpu" "gpu" false "nodeSelector" ($cpu.nodeSelector | default .Values.app.nodeSelector) "tolerations" ($cpu.tolerations | default .Values.app.tolerations) "affinity" ($cpu.affinity | default dict) "resources" $cpuRes "kinds" (list "SUMMARIZE" "TRANSLATE" "SUBTITLE" "ARCHIVE" "REPORT") "args" (list "python" "-m" "worker.cpu") "models" false "extraEnv" ($cpu.extraEnv | default dict) "image" $cpuImage)) }}
{{- end }}
{{- end }}
