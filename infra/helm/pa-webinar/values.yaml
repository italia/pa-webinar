# ============================================================================
# pa-webinar Helm Chart — Configurazione base
# ============================================================================
#
# Questo file contiene i valori predefiniti. Per il deployment, sovrapponi
# con uno dei file di esempio:
#
#   Semplice:  helm install videocall . -f examples/values-simple.yaml
#   Standard:  helm install videocall . -f examples/values-standard.yaml
#   Completa:  helm install videocall . -f examples/values-full.yaml
#
# Personalizza i valori specifici del tuo ambiente in un file separato.
# NON modificare questo file — crea un override.
#
# Documentazione: docs/DEPLOYMENT.md, docs/CONFIGURATION.md
# ============================================================================

# ── Application ──────────────────────────────────────────────

app:
  # Number of pod replicas (ignored when autoscaling.enabled=true)
  replicaCount: 2

  image:
    # Container image registry/repository
    repository: ghcr.io/italia/pa-webinar
    # Image tag — defaults to Chart.appVersion if empty
    tag: ""
    pullPolicy: IfNotPresent

  # ── Database migration image ──
  # The production runner image does not include npm/prisma CLI.
  # Migrations run in an initContainer using the builder-stage image,
  # which includes npx and prisma. Build with:
  #   docker build --target builder -t <repo>:<tag>-migrate .
  migration:
    image:
      repository: ghcr.io/italia/pa-webinar
      tag: ""  # Defaults to Chart.appVersion + "-migrate" suffix
      pullPolicy: IfNotPresent

  # Image pull secrets for private registries (e.g. ACR, ECR, GCR)
  imagePullSecrets: []
  #   - name: registry-credentials

  # Resource requests and limits
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

  # Node scheduling constraints (cloud-agnostic — set per environment)
  # Examples:
  #   AKS:  { agentpool: applications }
  #   GKE:  { cloud.google.com/gke-nodepool: applications }
  #   EKS:  { eks.amazonaws.com/nodegroup: applications }
  #   k3s:  {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # ── Non-secret environment variables ──
  # These are injected as a ConfigMap and mounted via envFrom.
  # NEXT_PUBLIC_* vars are read at runtime via lib/env.ts (server-side)
  # and passed as props to client components. A single pre-built image
  # works across environments — no rebuild needed per FQDN.
  env:
    NEXT_PUBLIC_JITSI_DOMAIN: "jitsi.videocall.example.com"
    NEXT_PUBLIC_APP_URL: "https://videocall.example.com"
    NEXT_PUBLIC_DEFAULT_LOCALE: "it"
    DEFAULT_DATA_RETENTION_DAYS: "30"
    # Informativa privacy linkata dal modulo di iscrizione quando l'evento non
    # ne indica una propria. Non impostata = la pagina /privacy del portale.
    # Si imposta solo per puntare a un'informativa pubblicata altrove.
    #   DEFAULT_PRIVACY_POLICY_URL: "https://<portale>/it/privacy"
    # Prometheus URL for PromQL queries from the app (admin monitoring, status page).
    # Set to the internal Prometheus service URL, e.g.:
    #   http://kube-prometheus-stack-prometheus.monitoring:9090
    # Leave empty to disable Prometheus integration (probe-only status page).
    PROMETHEUS_URL: ""

    # ── Client address for per-IP limits ──
    #
    # The app keys per-IP limits and the admin audit log on X-Forwarded-For
    # counted from the right. TRUSTED_PROXY_HOPS = how many entries trusted
    # infrastructure adds AFTER the client's. Unset = 0: the rightmost entry,
    # written by the ingress; right for ingress-nginx and Traefik defaults.
    # Counted like Envoy's xff_num_trusted_hops, NOT like Express "trust
    # proxy": the ingress itself is 0. When the ingress appends, one too high
    # lets a client choose its own key; one too low makes all clients share
    # one counter. Values per setup: docs/CONFIGURATION.md, "Client address
    # and rate limits".
    # Behind one load balancer/WAF that appends, or with the GKE Ingress
    # (classes gce, gce-internal: it appends "<client>,<lb-ip>"):
    #   TRUSTED_PROXY_HOPS: "1"

    # ── Service inventory (CycloneDX 1.6) ──
    #
    # Public transparency artifact served at /service-inventory. Describes
    # both software dependencies (DEV) and operational services (OPS) that
    # make up THIS tenant's deployment. For the format see
    # docs/SERVICE-INVENTORY.md ("Rendering contract"),
    # docs/SERVICE-INVENTORY-GENERATION.md ("The document model") or the
    # OWASP CycloneDX spec.
    #
    # Accepted forms:
    #   - absolute https URL (e.g. Azure Blob public container) — fetched
    #     with revalidate:3600
    #   - path starting with "/" served from the app's public/ directory
    #
    # Leave empty to render a "not yet published" placeholder. The image
    # ships no inventory: start from docs/examples/service-inventory.example.json
    # in the source tree and publish your own document.
    # Generation runbook + Azure reference implementation:
    #   docs/SERVICE-INVENTORY-GENERATION.md
    #   infra/service-inventory/azure/
    SERVICE_INVENTORY_URL: ""

    # ── Storage provider ──
    #
    # Two independent storage domains, each backed by any S3-compatible
    # service (AWS S3, MinIO, Cloudflare R2, Wasabi, GCS via HMAC, PSN)
    # or Azure Blob Storage. Auto-detected from whichever *_BUCKET or
    # CONNECTION_STRING is set, or force via STORAGE_FILES_PROVIDER /
    # RECORDING_STORAGE_TYPE.
    #
    # (Non-sensitive hints live here; credentials go in the Secret.)
    #
    # Files domain — event materials (PDFs, slides, images)
    #   AZURE_STORAGE_CONTAINER_NAME: "eventi-files"
    #   STORAGE_FILES_PROVIDER: "s3"          # azure | s3
    #   STORAGE_FILES_S3_ENDPOINT: ""         # e.g. https://minio.example.com (leave blank for AWS)
    #   STORAGE_FILES_S3_REGION: "eu-south-1"
    #   STORAGE_FILES_S3_BUCKET: "eventi-files"
    #   STORAGE_FILES_S3_FORCE_PATH_STYLE: "true"  # required for MinIO
    #
    # Recordings domain — Jibri MP4 + manual publications
    #   RECORDING_STORAGE_TYPE: "azure-blob"  # azure-blob | s3 | gcs | minio
    #   RECORDING_AZURE_CONTAINER: "recordings"
    #   RECORDING_S3_ENDPOINT: ""
    #   RECORDING_S3_REGION: "eu-south-1"
    #   RECORDING_S3_BUCKET: "recordings"
    #   RECORDING_S3_FORCE_PATH_STYLE: "true"
    #
    # CSP override when serving media from a non-standard host (e.g. R2,
    # custom MinIO with HTTP): set RECORDING_MEDIA_CSP_HOSTS to a
    # space-separated list of origins allowed in `media-src`.
    #   RECORDING_MEDIA_CSP_HOSTS: "https://cdn.example.com"

  # ── Security context ──

  securityContext:
    # Pod-level security context
    pod:
      runAsNonRoot: true
      runAsUser: 1001
      runAsGroup: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault

    # Container-level security context
    container:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1001
      capabilities:
        drop:
          - ALL

  # ── Writable volumes ──
  # Required because readOnlyRootFilesystem is enabled.
  # Next.js standalone needs /tmp and optionally .next/cache.
  extraVolumes:
    - name: tmp
      emptyDir:
        sizeLimit: 100Mi
    - name: next-cache
      emptyDir:
        sizeLimit: 500Mi

  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
    - name: next-cache
      mountPath: /app/.next/cache

  # ── Health probes ──

  probes:
    # Liveness probe — restarts the container if it becomes unresponsive.
    liveness:
      httpGet:
        path: /api/health
        port: http
      initialDelaySeconds: 15
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

    # Readiness probe — removes the pod from Service endpoints when unhealthy.
    # Uses /api/ready which validates DB schema compatibility via ORM queries,
    # catching migration drift that /api/health (SELECT 1) would miss.
    readiness:
      httpGet:
        path: /api/ready
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

    # Startup probe — gives the container time for initial startup.
    # Prevents liveness probe from killing a slow-starting container.
    # Uses /api/ready to ensure schema is valid before marking as started.
    startup:
      httpGet:
        path: /api/ready
        port: http
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 30

  # Additional pod annotations (e.g. for Vault agent injector)
  podAnnotations: {}

  # Additional pod labels
  podLabels: {}

# ── Secrets ─────────────────────────────────────────────────
#
# Three modes for managing secrets:
#   "existing"  — reference a pre-created Kubernetes Secret (default)
#   "external"  — use External Secrets Operator (Azure Key Vault, AWS SM, GCP SM)
#   "generate"  — chart creates Secret from values (dev/test ONLY)

secrets:
  mode: "existing"
  # Nome del Secret con il segreto JWT della conferenza (la sola chiave
  # JWT_APP_SECRET, stesso valore di JITSI_JWT_SECRET), da indicare anche in
  # jitsi-meet.prosody.jwt.existingSecretName. Lo rende il chart in modalita'
  # "generate" (da secrets.generate.JITSI_JWT_SECRET) ed "external" (dalla
  # stessa voce remota di JITSI_JWT_SECRET). In modalita' "existing" non si
  # rende: il Secret lo crei tu. Vuoto = nessun Secret reso, e il segreto
  # arriva a Prosody in un altro modo (vedi jitsi-meet.prosody.jwt).
  jitsiJwtSecretName: ""

  # Name of the Kubernetes Secret (used by all modes as the target name)
  existingSecretName: "videocall-secrets"

  # Secret con le sole password dei datastore in cluster (PostgreSQL, Redis).
  #
  # Conviene tenerlo separato da quello dell'applicazione: il sottochart
  # PostgreSQL monta per intero, come file dentro il proprio container, il
  # Secret da cui legge la password, quindi ogni chiave tenuta lì accanto —
  # a partire da quella che cifra i dati personali — diventa leggibile da chi
  # raggiunge il database. I profili di esempio per le nuove installazioni lo
  # valorizzano; per separarlo su un'installazione esistente, dove va fatto a
  # mano e prima dell'aggiornamento, vedi docs/operations/upgrades.md
  # ("Moving datastore passwords into a separate Secret").
  #
  # Vuoto = si usa lo stesso Secret dell'applicazione, che è ciò che fanno le
  # installazioni già in piedi. Il valore predefinito non cambia da solo.
  datastoreSecretName: ""

  # ── External Secrets Operator config (mode: "external") ──
  external:
    # Provider: "azure-key-vault", "aws-secrets-manager", "gcp-secret-manager"
    provider: "azure-key-vault"
    refreshInterval: "1h"
    # Versione dell'API dell'operatore. Vuoto = external-secrets.io/v1 dove il
    # cluster la serve (operatore 0.16 e successivi), v1beta1 solo dove il
    # cluster serve soltanto quella; senza un cluster da interrogare
    # (`helm template`) vale v1. Imposta "external-secrets.io/v1beta1" per un
    # operatore precedente alla 0.16 quando rendi i manifesti fuori dal cluster.
    apiVersion: ""

    azureKeyVault:
      vaultUrl: ""
      tenantId: ""
      # Maps Kubernetes secret keys → Key Vault secret names
      secretMappings:
        DATABASE_URL: "pa-webinar-database-url"
        REDIS_URL: "pa-webinar-redis-url"
        JITSI_JWT_SECRET: "pa-webinar-jitsi-jwt-secret"
        APP_SECRET: "pa-webinar-app-secret"
        ADMIN_API_KEY: "pa-webinar-admin-api-key"
        PII_ENCRYPTION_KEY: "pa-webinar-pii-encryption-key"
        CRON_API_KEY: "pa-webinar-cron-api-key"
        SMTP_HOST: "pa-webinar-smtp-host"
        SMTP_PORT: "pa-webinar-smtp-port"
        SMTP_USER: "pa-webinar-smtp-user"
        SMTP_PASSWORD: "pa-webinar-smtp-password"

    awsSecretsManager:
      region: ""
      # Maps Kubernetes secret keys → AWS Secrets Manager secret names
      secretMappings: {}

    gcpSecretManager:
      projectID: ""
      # Workload Identity: vuoti = l'operatore li ricava dal cluster GKE su cui
      # gira. Servono solo se l'operatore gira altrove.
      clusterLocation: ""
      clusterName: ""
      # Maps Kubernetes secret keys → GCP Secret Manager secret names
      secretMappings: {}

  # ── Generated secrets (mode: "generate", dev/test ONLY) ──
  generate:
    DATABASE_URL: ""
    # Leave empty when using the in-cluster `redis` subchart: the
    # templates inject an svc-based default at render time. Set
    # explicitly when pointing at an external / managed Redis.
    REDIS_URL: ""
    # Random password used by both the redis subchart (auth.enabled)
    # and the app (as part of the derived REDIS_URL). Regenerate per
    # deploy with: openssl rand -base64 32
    REDIS_PASSWORD: ""
    JITSI_JWT_SECRET: ""
    JITSI_JWT_APP_ID: "pa_webinar"
    JITSI_JWT_ISSUER: "pa-webinar"
    JITSI_JWT_AUDIENCE: "jitsi"
    APP_SECRET: ""
    ADMIN_API_KEY: ""
    PII_ENCRYPTION_KEY: ""
    CRON_API_KEY: ""
    SMTP_HOST: ""
    SMTP_PORT: "587"
    SMTP_SECURE: "false"
    SMTP_USER: ""
    SMTP_PASSWORD: ""
    SMTP_FROM: ""
    SMTP_FROM_NAME: ""

# ── Service ──────────────────────────────────────────────────

service:
  type: ClusterIP
  port: 3000
  # Annotazioni del Service dell'app. Servono dove il controller di
  # ingresso si configura dal Service: su GKE, ad esempio,
  # cloud.google.com/backend-config collega una BackendConfig con i timeout
  # lunghi che chiedono SSE e BOSH (il predefinito di 30 s li interrompe).
  annotations: {}

# ── NetworkPolicy ────────────────────────────────────────────
# Opt-in default-deny + allow-list for the application pods only (the
# Deployment). CronJobs, the JVB scaler, the config-reload hook, the
# recorder bot and controller and the post-production jobs are not
# selected: they need the API server, the bridges or the GPU pool, and
# are admitted to the application by the same-release ingress rule.
#
# Requires a CNI that enforces NetworkPolicy (Azure NPM, Calico or
# Cilium on AKS, Dataplane V2 on GKE, the VPC CNI network policy agent
# on EKS, kube-router on k3s). See docs/DEPLOYMENT.md.
#
# The ingress controller namespace depends on the controller:
#   ingress-nginx:     kubernetes.io/metadata.name: ingress-nginx (default)
#   Traefik on k3s:    kubernetes.io/metadata.name: kube-system
#   AKS app routing:   kubernetes.io/metadata.name: app-routing-system

networkPolicy:
  # Default off: lots of installs run on bare AKS without a policy
  # engine. Turn on once the operator is in place.
  enabled: false

  ingress:
    # Labels of the namespace(s) allowed to send traffic to the app
    # service port. Defaults to the typical ingress-nginx label.
    fromNamespaceSelectors:
      - kubernetes.io/metadata.name: ingress-nginx
    # Extra per-pod selectors (e.g. for a specific ingress controller
    # deployment) — added as additional `from` blocks. With both lists
    # empty the application port accepts every source.
    fromPodSelectors: []

    # Whether to also accept scrape traffic from the monitoring
    # namespace (Prometheus). The /metrics endpoint is still auth-
    # gated at the application layer.
    allowMonitoring: true
    monitoringNamespaceSelector:
      kubernetes.io/metadata.name: monitoring

    # Additional NetworkPolicyIngressRule entries, appended as-is.
    extraRules: []

  egress:
    # DNS. The default matches CoreDNS/kube-dns pods in any namespace.
    # With NodeLocal DNSCache (common on GKE) add its address, e.g.
    #   - ipBlock: { cidr: 169.254.20.10/32 }
    dns:
      to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns

    # Postgres allow-list. Override `to` for an external managed DB
    # (use ipBlock with cidr=<DB IP>/32) or leave as the in-cluster
    # Bitnami chart match.
    postgres:
      port: 5432
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql

    # Redis allow-list (same pattern as Postgres).
    redis:
      port: 6379
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis

    # In-cluster Jitsi: Prosody (5222/5280, XMPP for JWT-authenticated
    # room creation), the bridge REST API (8080, JVB_HEALTH_URL) and the
    # Jibri health API (2222, JIBRI_HEALTH_URL). When jitsi.enabled=false
    # this stays effectively empty and the HTTPS rule below covers the
    # external instance.
    jitsi:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jitsi-meet
      ports:
        - port: 5222
          protocol: TCP
        - port: 5280
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 2222
          protocol: TCP

    # The ingress controller, reached when the application calls the
    # portal's or the conference's public hostname (status checks,
    # absolute links). Inside the cluster the call is translated to the
    # controller pod, so the policy must allow the controller's
    # container ports: 443 for ingress-nginx, 8443 for Traefik. The
    # peers are the namespaces in ingress.fromNamespaceSelectors.
    ingressController:
      enabled: true
      ports: [443, 8443]

    # Additional NetworkPolicyEgressRule entries, appended as-is. Use it
    # for in-cluster services the application calls, for example
    # Prometheus (PROMETHEUS_URL) or an in-cluster S3 endpoint:
    #   - to:
    #       - namespaceSelector:
    #           matchLabels: { kubernetes.io/metadata.name: monitoring }
    #     ports:
    #       - { protocol: TCP, port: 9090 }
    extraRules: []

    # Outbound SMTP port for the email queue cron. Default is the
    # submission port (587/STARTTLS). Set allowImplicitTlsSmtp to also
    # open 465 if your relay still uses implicit-TLS.
    smtpPort: 587
    allowImplicitTlsSmtp: false

    # CIDRs to *exclude* from the broad TCP/443 egress. The default
    # blocks only the cloud Instance Metadata Service endpoints (AWS
    # IMDS / Azure / GCP — all on 169.254.0.0/16), so a compromised
    # pod cannot reach for cloud credentials. We intentionally do NOT
    # exclude RFC1918 ranges here because some installs reach private
    # endpoints (Azure Private Link, AWS PrivateLink) over 443; if
    # your cluster doesn't need that, add 10.0.0.0/8 etc. to the
    # override.
    httpsExcept:
      - 169.254.0.0/16

# ── ServiceAccount ───────────────────────────────────────────

serviceAccount:
  # Create a dedicated ServiceAccount for the app pods
  create: true
  # Annotations (e.g. for Azure Workload Identity, GKE Workload Identity, IRSA)
  annotations: {}
  #   azure.workload.identity/client-id: "<managed-identity-client-id>"
  #   iam.gke.io/gcp-service-account: "<gsa-name>@<project>.iam.gserviceaccount.com"
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::<account>:role/<role>"
  # Override the ServiceAccount name (defaults to release fullname)
  name: ""

# ── Ingress ──────────────────────────────────────────────────

ingress:
  enabled: true
  # Classe dell'Ingress: `nginx` per ingress-nginx, `traefik` per il Traefik
  # di k3s, o quella del tuo controller.
  className: nginx
  # Helm fonde le mappe: `{}` in un file di override non toglie le chiavi
  # predefinite, si toglie una chiave impostandola a null.
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Sopra il file più grande che l'app accetta passando da sé: i materiali
    # dell'evento, dalla sala e dall'area admin, fino a 25 MiB più la cornice
    # del modulo (`MATERIAL_FILE_MAX_BYTES` in app/src/lib/validation/
    # materials.ts). Più basso, ingress-nginx risponde 413 a file che l'app
    # dichiara ammessi. Le registrazioni non passano di qui: vanno dritte
    # allo storage con un URL firmato. Il limite alto non vale per le rotte
    # JSON: l'app rifiuta con 413 un corpo JSON oltre 10 MiB prima di leggerlo
    # (`JSON_BODY_MAX_BYTES` in app/src/lib/api-handler.ts).
    nginx.ingress.kubernetes.io/proxy-body-size: "30m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    # Nessun limite di frequenza qui di proposito. Le annotazioni che stavano
    # in questo punto (`rate-limit`, `rate-limit-window`) non esistono in
    # ingress-nginx e non facevano nulla: promettevano una protezione assente.
    # Quelle vere sono `limit-rps`, `limit-connections`,
    # `limit-burst-multiplier` — vedi values-production.yaml — ma il valore va
    # scelto guardando il traffico reale: la sala in diretta apre più
    # connessioni per partecipante, e un limite stretto la fa cadere.
    # Oggi è l'unico limite condiviso fra le repliche che esista: quello
    # applicativo conta per singolo processo.
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "31536000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
    nginx.ingress.kubernetes.io/hsts-preload: "true"
  # Classi di controller che non sono ingress-nginx. Con una di queste in
  # `className` il chart toglie le annotazioni `nginx.ingress.kubernetes.io/*`,
  # che quel controller ignorerebbe senza avviso. Con qualunque altra classe,
  # comprese quelle di ingress-nginx con un nome scelto da te, restano: senza
  # `proxy-body-size` ingress-nginx torna al limite di 1 MB e i caricamenti più
  # grandi falliscono con 413.
  nonNginxClassNames:
    - traefik
    - haproxy
    - kong
    - alb
    - gce
    - gce-internal
    - azure-application-gateway
    - istio
    - cilium
  hosts:
    - host: videocall.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: videocall-tls
      hosts:
        - videocall.example.com

# ── Horizontal Pod Autoscaler ────────────────────────────────

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  # Scale up when average CPU across all pods exceeds 70%
  targetCPUUtilizationPercentage: 70
  # Scale up when average memory exceeds 80%
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleDown:
      # Wait 5 minutes before scaling down to avoid flapping
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      # React to load spikes within 30 seconds
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

# ── Pod Disruption Budget ────────────────────────────────────

podDisruptionBudget:
  enabled: true
  # At least 1 pod must remain available during voluntary disruptions
  # (e.g. node drain, rolling update)
  minAvailable: 1

# PDB per coturn (subchart jitsi-meet, che non ne fornisce uno).
# coturn e' l'INTERO media path in relay-only e la lifeline TURNS/443 corporate.
# Con replicaCount=1, minAvailable=1 impedisce a un node drain volontario di eliminare
# l'unico relay a evento in corso (il drain viene bloccato finche' non c'e' un rimpiazzo).
# Per avere ANCHE la drenabilita' senza interruzioni, portare coturn a 2 repliche
# (funziona dietro singolo LB: l'hash 5-tuple di Azure tiene ogni client sullo stesso pod).
# Negli ambienti spenti a orario la protezione va rovesciata: con coturn fermo o a
# una sola replica, minAvailable=1 lascia il PDB a disruptionsAllowed=0 e ogni drain
# volontario resta appeso, compreso l'aggiornamento automatico dell'immagine dei nodi.
# Valorizzare maxUnavailable (mutuamente esclusivo con minAvailable, il PDB non li
# accetta entrambi) rende il pool drenabile rinunciando alla protezione.
coturnPodDisruptionBudget:
  enabled: true
  minAvailable: 1
  # Se valorizzato, sostituisce minAvailable.
  maxUnavailable: ""
  # IfHealthyBudget (il default di Kubernetes) impedisce di evacuare un pod non
  # Ready quando il budget e` gia` esaurito, e inchioda drain e scale-down.
  unhealthyPodEvictionPolicy: AlwaysAllow

# ── CronJobs ─────────────────────────────────────────────────

cronjobs:
  # GC dei Job terminati (ttlSecondsAfterFinished, successo E fallimento).
  # Senza TTL un Job fallito resta visibile per giorni (failedJobsHistoryLimit
  # conta solo i fallimenti successivi) e tiene acceso l'alert KubeJobFailed
  # molto oltre il problema reale.
  # - jobTtlSeconds (2h): cron FREQUENTI (≤15min) — un guasto persistente
  #   produce comunque sempre un Job fallito recente, quindi l'alert resta su.
  # - dailyJobTtlSeconds (72h): cron RARI (giornalieri / ogni 6h) — con un TTL
  #   corto un fallimento notturno sparirebbe (Job+log+alert) prima dell'orario
  #   lavorativo e un guasto persistente resterebbe invisibile; 72h copre
  #   anche il weekend.
  # postprod-worker e recorder hanno il PROPRIO knob
  # (postprod.worker.ttlSecondsAfterFinished / recorder.ttlSecondsAfterFinished,
  # default 600s), invariato.
  jobTtlSeconds: 7200
  dailyJobTtlSeconds: 259200

  # Email reminders for upcoming events (runs every 15 minutes)
  reminders:
    enabled: true
    schedule: "*/15 * * * *"
    image: curlimages/curl:8.11.1

  # GDPR data cleanup — deletes PII past retention period (daily at 03:00)
  cleanup:
    enabled: true
    schedule: "0 3 * * *"
    image: curlimages/curl:8.11.1

  # Orphan recording reconciliation — scans the recording bucket,
  # upserts orphan_recordings rows for blobs not linked to any event or
  # session, and sweeps entries whose grace period has expired.
  # Runs every 6h by default; keep this disabled in dev where the
  # bucket isn't configured.
  recordingsReconcile:
    enabled: true
    schedule: "17 */6 * * *"
    image: curlimages/curl:8.11.1

  # Inactive-person rubrica cleanup — deletes Person rows past their
  # per-row retention window (default 24 months since last activity)
  # and purges opt-outed persons. Runs daily at 04:00.
  rubricaRetention:
    enabled: true
    schedule: "0 4 * * *"
    image: curlimages/curl:8.11.1

  # Email outbox processor — drains queued emails (confirmations,
  # reminders, date-change notifications) via pooled SMTP. Runs every
  # minute; see src/app/api/cron/email-outbox/route.ts for batch size
  # and retry policy.
  emailOutbox:
    enabled: true
    schedule: "*/1 * * * *"
    image: curlimages/curl:8.11.1

# ── Immagine kubectl ─────────────────────────────────────────
# Usata dai lavori che parlano con l'API di Kubernetes (scaler dei bridge,
# orchestratore della post-produzione, riavvio della configurazione web)
# quando il loro campo `image` è vuoto. Serve una shell con kubectl, curl,
# grep e sed.
#
# Fissata per digest: nel registro pubblico Bitnami pubblica ormai solo il tag
# `latest`, che cambia contenuto a ogni ricostruzione, e i tag con la versione
# (per esempio `1.29`) non esistono più. Questo digest è kubectl 1.37.1. Per
# aggiornarlo si risolve il digest corrente di `latest` e lo si prova prima di
# cambiarlo qui. Un cluster senza accesso a Docker Hub la specchia nel proprio
# registro e mette qui il riferimento.
kubectlImage: "docker.io/bitnami/kubectl@sha256:ab90e1058e5a658cc94b4e7eb6d48e5758cfd6d77b5dd1869513aec3a3054673"

# ── JVB Auto-Scaler ─────────────────────────────────────────
# CronJob that scales JVB replicas based on upcoming/active events.
# Only used with jitsi.mode=full. No external dependencies (no KEDA).
# Calls the internal /api/internal/jvb-desired-replicas endpoint.

jvbScaler:
  enabled: false
  schedule: "*/2 * * * *"
  # Empty → kubectlImage.
  image: ""
  # Name of the JVB Deployment to scale.
  # Leave empty to auto-detect by label (app.kubernetes.io/component=jvb)
  # or name pattern. Set explicitly if auto-detection fails: the subchart
  # names it `<release>-jitsi-meet-jvb-0` (one Deployment per port of the
  # range, suffixed -0, -1, …).
  jvbDeploymentName: ""

# ── Web config-reload hook ───────────────────────────────────
# Post-upgrade/post-install Job that `rollout restart`s the Jitsi components
# whose runtime config (config.js, …) is generated at pod startup from
# configmaps. The jitsi-meet web Deployment's checksum/config only covers the
# MAIN web configmap, NOT the custom-config one (_custom_config_js), so changes
# to the custom config (e.g. TURN / iceTransportPolicy='relay') don't roll the
# web pod by themselves and the served config.js stays stale until a manual
# `kubectl rollout restart`. This hook automates that on every deploy.
configReloadHook:
  enabled: true
  # Jitsi components (by app.kubernetes.io/component label) to rollout-restart.
  # Default: web (config.js). Add jicofo / prosody if you change their custom config.
  components:
    - web
  # Image with kubectl. Empty → jvbScaler.image, then kubectlImage.
  image: ""

# ── Prometheus Metrics ───────────────────────────────────────

metrics:
  # Path where the app exposes Prometheus metrics
  path: /api/metrics
  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
    # Extra labels to match Prometheus Operator's serviceMonitorSelector
    additionalLabels: {}
    #   release: prometheus
  # Optional: authenticate scrapes with a bearer token from a Secret
  # bearerTokenSecret:
  #   name: videocall-secrets
  #   key: CRON_API_KEY

  # ── PrometheusRule (alerting) ──
  # Requires Prometheus Operator. Creates alert rules for app health,
  # latency, error rate, JVB stress, and event loop lag.
  prometheusRule:
    enabled: false
    # Extra labels to match Prometheus Operator's ruleSelector
    additionalLabels: {}
    #   release: prometheus
    # Custom additional rules (appended to built-in rules)
    rules: []

  # ── Grafana Dashboard ──
  # Creates a ConfigMap with the pa-webinar Grafana dashboard JSON.
  # The Grafana sidecar auto-discovers ConfigMaps with grafana_dashboard: "1".
  grafanaDashboard:
    enabled: false
    # Grafana folder to place the dashboard in
    folder: ""
    # Extra labels for the ConfigMap
    additionalLabels: {}

# ── Jitsi Meet ───────────────────────────────────────────────

jitsi:
  # Set to false to use an external Jitsi instance.
  # When true, the jitsi-meet subchart is deployed.
  enabled: true

  # Deployment mode:
  #   "simple"   — JVB runs on any node, no scale-to-zero, no Jibri
  #   "standard" — JVB on any node, Jibri enabled, no scale-to-zero
  #   "full"     — JVB on dedicated nodes with taints, scale-to-zero ready, Jibri on dedicated nodes
  mode: "simple"

  # Pretende che le credenziali interne della conferenza (password XMPP di
  # Jicofo, del bridge, di Jibri e del bot di registrazione, segreto di coturn)
  # siano fissate nei valori o in un Secret esistente. Il sottochart genera a
  # caso quelle mancanti a ogni resa: ogni `helm upgrade` riavvierebbe Prosody,
  # Jicofo e il bridge, facendo cadere le conferenze in corso. Con `true` la
  # resa si ferma ed elenca le chiavi mancanti; con `false` le note dopo
  # l'installazione le elencano soltanto. I profili di esempio elencano le
  # chiavi da fissare.
  requirePinnedCredentials: false

  # Indirizzo dell'API REST del bridge (/colibri/stats) letto dall'applicazione
  # per stato e metriche. Vuoto = il Service del sottochart se espone la porta
  # 8080 (`jvb.service.extraPorts`), altrimenti un Service reso da questo chart.
  jvbHealthUrl: ""
  # Indirizzo dell'API di salute di Jibri. Vuoto = il Service del sottochart.
  jibriHealthUrl: ""

  # ── Jitsi root redirect ──
  # Creates an Exact / ingress that redirects to the portal URL (301).
  # The subchart's Prefix / ingress still serves all other paths.
  # Nginx gives Exact match higher priority than Prefix. The redirect is an
  # ingress-nginx annotation: with another controller it has no effect.
  webIngress:
    redirectUrl: ""  # e.g. "https://videocall.example.com"
    ingressClassName: nginx
    annotations: {}
    hosts:
      - host: jitsi.videocall.example.com
    tls:
      - secretName: jitsi-tls
        hosts:
          - jitsi.videocall.example.com

  # ── External Jitsi configuration (when jitsi.enabled=false) ──
  external:
    # Jitsi domain as seen by the browser (e.g. jitsi.example.com)
    domain: ""
    jwtSecret: ""
    jwtAppId: ""
    jwtIssuer: ""
    jwtAudience: ""

# ── jitsi-meet subchart values ───────────────────────────────
# These are passed directly to the jitsi-meet Helm subchart.
# Only effective when jitsi.enabled=true.
# Docs: https://github.com/jitsi-contrib/jitsi-helm

jitsi-meet:
  publicURL: "https://jitsi.videocall.example.com"
  enableAuth: true
  enableGuests: false

  # Global pull secrets for ALL jitsi component pods (the subchart exposes only
  # a single global list, not per-component). `ghcr-secret` serve perché
  # `web.image` qui sotto è l'immagine patchata su un registro privato;
  # `dockerhub-secret` evita il limite di prelievo anonimo sulle immagini
  # standard. Entrambi i Secret devono già esistere nel namespace.
  #
  # Su un'installazione che usa l'immagine web standard non servono: si
  # sostituiscono con una lista vuota insieme all'override di `web.image`.
  # Un Secret nominato ma inesistente non blocca il prelievo di un'immagine
  # pubblica, ma lascia un evento di errore su ogni pod.
  imagePullSecrets:
    - name: ghcr-secret
    - name: dockerhub-secret

  # Autenticazione della conferenza con i token dell'applicazione. Issuer e
  # audience accettati devono contenere JITSI_JWT_ISSUER e JITSI_JWT_AUDIENCE
  # dell'applicazione, e il segreto deve essere JITSI_JWT_SECRET: se divergono
  # Prosody rifiuta ogni token e nessuno entra in sala, senza errori visibili
  # nel portale. Per cambiarli si cambiano qui, in `prosody.extraEnvs`: per
  # Prosody questa mappa vince su `extraCommonEnvs`, e il chart si rifiuta di
  # rendere se i due dicono cose diverse.
  prosody:
    extraEnvs:
      AUTH_TYPE: jwt
      JWT_APP_ID: pa_webinar
      JWT_ACCEPTED_ISSUERS: pa-webinar
      JWT_ACCEPTED_AUDIENCES: jitsi
    # Il segreto arriva a Prosody come JWT_APP_SECRET. Una sola di queste strade:
    #   - `jwt.secret`: il valore, e il sottochart rende il Secret;
    #   - `jwt.existingSecretName`: un Secret con la chiave JWT_APP_SECRET,
    #     creato a mano o reso dal chart con `secrets.jitsiJwtSecretName`;
    #   - una voce in `extraSecrets` che legge JITSI_JWT_SECRET dal Secret
    #     dell'applicazione (un solo valore da ruotare):
    #       extraSecrets:
    #         - name: JWT_APP_SECRET
    #           valueFrom:
    #             secretKeyRef: { name: videocall-secrets, key: JITSI_JWT_SECRET }
    # Con `secret` ed `existingSecretName` insieme il sottochart ignora il
    # primo senza dirlo: il chart si rifiuta di rendere.
    jwt:
      secret: ""
      existingSecretName: ""

  jvb:
    replicaCount: 1
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "3"
        memory: 4Gi
    nodeSelector: {}
    tolerations: []
    useHostPort: true
    useNodeIP: true
    UDPPort: 10000
    # STUN con cui il bridge scopre il proprio indirizzo pubblico. Il valore
    # predefinito del sottochart è un server di terzi (jitsi.net): il bridge vi
    # manda richieste e rivela il proprio indirizzo. Alternative: "" quando
    # l'indirizzo annunciato è già quello giusto (`publicIPs`, oppure
    # `useNodeIP` su un nodo con indirizzo pubblico sulla scheda di rete), un
    # tuo server STUN, oppure il coturn del chart (`coturn.enabled`, `turnHost`
    # e `useInternalStun: true`, tutti e tre). Attenzione: su un nodo con
    # indirizzo privato dietro NAT (le VM dei cloud pubblici) `useNodeIP`
    # annuncia l'indirizzo privato, e senza STUN né `publicIPs` chi è fuori
    # dalla rete entra in sala ma non sente e non vede nessuno.
    stunServers: "meet-jit-si-turnrelay.jitsi.net:443"
    # Le password XMPP interne (`jicofo.xmpp.password`, `jvb.xmpp.password`, e
    # con Jibri `jibri.xmpp.password` e `jibri.recorder.password`) vanno
    # generate una volta e passate a ogni aggiornamento: vedi
    # jitsi.requirePinnedCredentials.

  jibri:
    enabled: false
    replicaCount: 0
    singleUseMode: true
    nodeSelector: {}
    tolerations: []

  web:
    # Immagine web con la patch che forza a 48 kHz il contesto audio della
    # soppressione rumore avanzata. Senza la patch quel filtro, su alcuni
    # browser, ammutolisce il microfono senza alcun errore visibile — e il
    # danno si scopre a evento iniziato.
    #
    # Chi non può prelevare questa immagine usa quella standard, sostituendo il
    # blocco con `repository: jitsi/web` e svuotando `imagePullSecrets` sopra:
    # in quel caso la soppressione avanzata deve restare spenta, che è già il
    # comportamento predefinito dell'applicazione. Le due impostazioni sono
    # legate, e il chart si rifiuta di rendere una combinazione incoerente.
    #
    # `pullPolicy: Always` è voluto: il tag viene riscritto sul posto quando la
    # patch cambia, e un nodo che serve una copia vecchia ammutolirebbe in
    # silenzio. Un prelievo fallito è invece un guasto rumoroso e reversibile.
    # Un aggiornamento con `--reuse-values` non riprende i valori predefiniti
    # del file: passa l'override esplicitamente.
    # ATTENZIONE: questo tag non coincide con `IMAGE_TAG` in
    # .github/workflows/jitsi-web.yml, che pubblica una revisione più recente.
    # Allinearli è un rollout dell'immagine della conferenza e va deciso, non
    # fatto di passaggio: finché restano diversi, chi si appoggia a questo
    # valore predefinito serve una revisione più vecchia di quella pubblicata.
    image:
      repository: ghcr.io/italia/pa-webinar-jitsi-web
      tag: stable-10741-rnnoise
      pullPolicy: Always
    ingress:
      enabled: true
      # Per un altro controller si cambia solo la classe. Niente annotazione
      # `kubernetes.io/ingress.class`: l'API server rifiuta un Ingress in cui
      # annotazione e classe non coincidono, e da qui non la si potrebbe
      # togliere (Helm fonde le mappe dei sottochart).
      ingressClassName: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        # `paths` is a list of STRINGS: the pinned jitsi-meet subchart renders
        # each entry directly into `path:`. Writing it as the richer
        # `- path: / / pathType: Prefix` mapping renders the map itself into the
        # field, and the API server rejects the Ingress because the value is not
        # an absolute path. The subchart always sets `pathType: Prefix` itself.
        - host: jitsi.videocall.example.com
          paths: ["/"]
      tls:
        - secretName: jitsi-tls
          hosts:
            - jitsi.videocall.example.com

# ── Registrazione composita (Jibri) ──────────────────────────
# Non esiste un blocco `recording:` in questo chart: nessun template lo
# leggeva, e i valori messi lì non avevano effetto. La registrazione si
# configura dove viene letta davvero:
#   - storage delle registrazioni: `app.env` (RECORDING_STORAGE_TYPE,
#     RECORDING_AZURE_CONTAINER, RECORDING_S3_*) e le credenziali nel Secret
#     dell'applicazione (RECORDING_AZURE_CONNECTION_STRING,
#     RECORDING_S3_ACCESS_KEY_ID, RECORDING_S3_SECRET_ACCESS_KEY);
#   - Jibri: `jitsi-meet.jibri.*`. Lo script che carica il file e avvisa il
#     portale a fine registrazione va passato in
#     `jitsi-meet.jibri.custom.other._finalize_sh`, insieme a
#     `jitsi-meet.jibri.extraEnvs.APP_INTERNAL_URL` e a CRON_API_KEY (per
#     esempio con `jitsi-meet.jibri.extraSecretsFrom` sul Secret
#     dell'applicazione). Il ConfigMap `<fullname>-jibri-finalize` reso da
#     questo chart ne contiene una copia, ma il sottochart non lo monta;
#   - conservazione: la decide l'applicazione (pannello di amministrazione e
#     cron di pulizia), non il chart.

# ── PostgreSQL ───────────────────────────────────────────────

postgresql:
  # Set to false to use an external database (Azure DB, RDS, Cloud SQL, etc.)
  enabled: true

  # Immagine fissata per digest dentro il tag (`latest@sha256:…`, PostgreSQL
  # 18.6.0). Il sottochart punta a `latest`, l'unico tag che Bitnami pubblica
  # ancora nel registro pubblico: un nodo che la preleva quando esce una nuova
  # versione maggiore avvierebbe un server che rifiuta la cartella dati
  # esistente, e il database non ripartirebbe. Un cambio di versione maggiore
  # richiede una migrazione dei dati (dump e ripristino), non un cambio di
  # tag. Chi imposta `tag` sostituisce tutto il valore; chi cambia `registry`
  # o `repository` (un registro specchio) deve cambiare anche `tag`.
  image:
    tag: "latest@sha256:21b97a850d7417940e58d929b8d0ebb0fc9b9f44bc1b6cd8f128d1b4ce6988e5"

  auth:
    username: eventi
    database: pa_webinar
    # Secret da cui il sottochart legge le password. Viene montato per intero,
    # come file, dentro il container del database: se ci tieni anche le chiavi
    # dell'applicazione, chi raggiunge quel container le legge. Vedi
    # secrets.datastoreSecretName per separarli.
    existingSecret: "videocall-secrets"
    secretKeys:
      adminPasswordKey: POSTGRES_ADMIN_PASSWORD
      userPasswordKey: POSTGRES_PASSWORD

  primary:
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    persistence:
      enabled: true
      size: 10Gi
      storageClass: ""  # Use cluster default

    securityContext:
      enabled: true
      fsGroup: 1001

    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

  # ── External PostgreSQL (when postgresql.enabled=false) ──
  external:
    host: ""
    port: 5432
    database: "pa_webinar"
    # Pre-existing Secret containing DATABASE_URL
    existingSecret: ""
    secretKey: "DATABASE_URL"

# ── Redis ────────────────────────────────────────────────────
#
# Redis powers real-time chat fan-out (pub/sub) across app pods.
# Disable and point the REDIS_URL secret at a managed Redis (Azure
# Cache, ElastiCache, MemoryStore, …) for production deployments.
redis:
  enabled: true

  architecture: standalone  # single node is enough for pub/sub + rate-limit

  # Nel registro pubblico Bitnami pubblica ormai solo il tag `latest`, che
  # cambia contenuto a ogni ricostruzione, e i tag predefiniti del sottochart
  # non esistono più. L'immagine è fissata per digest dentro il tag
  # (`latest@sha256:…`, Redis 8.10.2): un nodo nuovo non preleva una versione
  # diversa da quella degli altri. Chi imposta `tag` sostituisce tutto il
  # valore, digest compreso; chi cambia `registry` o `repository` (un registro
  # specchio) deve cambiare anche `tag`.
  image:
    tag: "latest@sha256:ef8442c1ec2e28cef662999f348a4369c22343dc0c86c3bc23041fad22f13ca1"
    pullPolicy: IfNotPresent

  # L'esportatore di metriche, se lo accendi (`metrics.enabled`): il suo tag
  # predefinito nel sottochart non esiste più, stesso rimedio (redis-exporter
  # 1.92.0).
  metrics:
    image:
      tag: "latest@sha256:5c505fe0a1666711039cb2c0c7ad6d1a8eba9d2f3393b809a9846e9260243446"

  auth:
    enabled: true
    # Obbligatorio: con l'autenticazione attiva Redis non parte senza password.
    # Vedi secrets.datastoreSecretName per tenerlo separato da quello
    # dell'applicazione.
    existingSecret: "videocall-secrets"
    existingSecretPasswordKey: "REDIS_PASSWORD"

  master:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      # pub/sub is ephemeral; we don't need AOF/RDB durability. Turn
      # it on if you plan to reuse the same Redis for other stateful
      # features (distributed rate-limit counters, cache).
      enabled: false

  commonConfiguration: |
    # No persistence: pub/sub is fire-and-forget and canonical chat
    # state lives in Postgres.
    save ""
    appendonly no
    # Pub/sub buffers: allow bigger spikes during a live event (300
    # subscribers × a few messages/sec peak) without Redis killing
    # slow consumers. Defaults are 32mb hard / 8mb soft for pubsub.
    client-output-buffer-limit pubsub 64mb 16mb 60

# ── Postprod AI pipeline ────────────────────────────────────
#
# Adds a post-production lifecycle on top of Jibri recordings:
# transcription (WhisperX large-v3 + pyannote 3.1), summary + translation
# (in-cluster vLLM, default model Mistral-Small-3.2-24B-Instruct). See
# docs/POSTPROD.md.
#
# Sovereignty: every component runs in-cluster on the GPU node pool.
# No external API calls. Pre-populate model weights into a PVC mounted
# at /models (see `worker.modelsPvc`) — at runtime HF_HUB_OFFLINE=1
# is set in the container.
#
# Recommended hardware (Italy North, 2026):
#   - 1× A100 80GB (Standard_NC24ads_A100_v4) — ospita il modello LLM di
#     default (~48 GB di pesi in fp16)
#     + WhisperX large-v3 + pyannote 3.1 simultaneamente.
#   - Pool con `min_count=0, max_count=2`, taint `workload=ai-gpu:NoSchedule`.
#   - Su AKS il pool lo crea infra/tofu/aks con `gpu_pool = { enabled = true }`,
#     con questo SKU, etichetta e taint come valori predefiniti.
#
# Enable the orchestrator only on clusters that have a GPU node pool
# AND a vLLM Service reachable from the worker.
postprod:
  enabled: false

  # Janitor: every ~1 min, reclaims expired leases and terminal-fails
  # over-attempt jobs.
  reclaim:
    enabled: true
    schedule: "* * * * *"
    image: curlimages/curl:8.10.1

  # Retention sweeper: daily.
  retention:
    enabled: true
    schedule: "30 3 * * *"
    image: curlimages/curl:8.10.1

  # Orchestrator: every minute, queries `/api/internal/postprod-pending`
  # and creates worker Jobs from the suspended template CronJob.
  orchestrator:
    enabled: true
    schedule: "* * * * *"
    # Empty → kubectlImage.
    image: ""

  # vLLM (LLM server per i task SUMMARIZE/TRANSLATE). E' un Deployment GPU
  # separato (oggi applicato a mano, vedi docs/POSTPROD.md). Su un pool
  # aigpu scale-to-zero, tenerlo sempre a replicas=1 vanifica lo
  # scale-to-zero e tiene acceso il nodo GPU anche a vuoto.
  vllm:
    # Se true, l'orchestrator scala il Deployment vLLM a 1 quando c'e'
    # lavoro postprod (desired>0 o worker attivi) e a 0 quando la pipeline
    # e' idle. Concede automaticamente all'orchestrator l'RBAC
    # deployments/scale. Default false: abilitare dopo aver reso il
    # Deployment vLLM gestito e tollerante al taint Spot del pool aigpu.
    autoscale: false
    # Nome del Deployment vLLM da scalare. Vuoto => "<fullname>-vllm".
    deploymentName: ""

  # Worker template (CronJob, suspended). The orchestrator runs
  # `kubectl create job --from=cronjob/<this>`, inheriting the pod
  # spec defined here (image, nodeSelector, tolerations, resources).
  worker:
    enabled: true
    image: ghcr.io/italia/pa-webinar-postprod-worker:dev
    imagePullPolicy: IfNotPresent
    # Pull credentials for the (private) worker image. The worker lands
    # on a fresh scale-from-zero GPU node with no cached image, so it
    # needs these. Empty → inherits `app.imagePullSecrets` (see the
    # worker CronJob template). Set explicitly only to override.
    imagePullSecrets: []
    # Hard ceiling per Job (kills runaway transcription). 1h is enough
    # for a 2h call at ~2x realtime on A100.
    activeDeadlineSeconds: 3600
    # Keep finished Job objects around for 10m so the orchestrator can
    # see their state in `kubectl get jobs`.
    ttlSecondsAfterFinished: 600

    # Run WhisperX + LLM stub mode — skips real ASR/LLM and emits
    # canned outputs. Useful for end-to-end smoke tests of the
    # claim/upload/register loop without a GPU.
    stub: false

    # Place workers on the GPU node pool. Override per-cluster.
    nodeSelector:
      workload: ai-gpu
    tolerations:
      - key: workload
        operator: Equal
        value: ai-gpu
        effect: NoSchedule
    affinity: {}

    # PVC with prefetched HF cache. Recommended for prod — first cold
    # download of WhisperX large-v3 + pyannote 3.1 is ~6GB. Without a
    # PVC, the worker re-downloads on every node cold-start (and with
    # HF_HUB_OFFLINE=1 in the image, the download must be primed
    # manually before the first run).
    #   modelsPvc: ai-models
    modelsPvc: ""
    modelsSizeLimit: "30Gi"
    workSizeLimit: "20Gi"

    # HuggingFace token for the gated pyannote model. Without it,
    # diarization fails at load time. Create a Secret manually:
    #   kubectl create secret generic hf-token --from-literal=HF_TOKEN=hf_xxx
    hfTokenSecret:
      name: ""
      key: HF_TOKEN

    extraEnv: {}
      # AI_VLLM_BASE_URL: "http://pa-webinar-vllm.ai:8000/v1"
      # AI_VLLM_MODEL_ID: "Qwen/Qwen3-32B-Instruct"

    gpu:
      enabled: true
      count: 1

    # The worker owns a dedicated GPU node (nodeSelector + taint), e.g.
    # NC24ads_A100_v4 = 24 vCPU / ~220 GB / 1×A100, shared only with
    # system DaemonSets. With one worker per node the old 4/16→12/48
    # caps left most of the box idle and throttled WhisperX + pyannote
    # (CPU-bound audio decode/diarization) and risked OOM on long calls.
    # Burstable: schedule on solid requests, burst to nearly the whole
    # node. Limits stay under allocatable (~23.6 CPU / ~215Gi) to leave
    # headroom for kubelet + DaemonSets.
    resources:
      requests:
        cpu: "8"
        memory: "32Gi"
      limits:
        cpu: "22"
        memory: "200Gi"

# ── Recorder multi-traccia (ADR-013 Fase 3) ─────────────────
# Feature "full mode": registrazione audio per-partecipante per attribuzione
# speaker certa. Disabilitata di default. Su VM/compose si usa il runner Docker
# del controller (RUNNER=docker), non questo chart. Vedi infra/recorder-controller.
recorder:
  enabled: false

  # Immagine del bot recorder (Puppeteer + lib-jitsi-meet, un'audio-track per
  # partecipante). Gira sul pool NORMALE, non GPU.
  image: ghcr.io/italia/pa-webinar-recorder:dev
  # NOTE on stale images: with a MUTABLE tag like `:dev`, IfNotPresent may reuse
  # a node's cached (possibly outdated) layer for that tag. Set `Always` via a
  # values override so each recorder Job re-pulls the current `:dev`: a cached
  # layer from an older recorder build can capture only silence. The chart
  # DEFAULT stays IfNotPresent so an
  # offline / air-gapped cluster that pre-loads the image (or a registry outage)
  # doesn't turn every recording into ImagePullBackOff. When you enable the
  # recorder with registry access, pin an immutable digest or set `Always`.
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Dominio Jitsi per il bot; se vuoto usa app.env.NEXT_PUBLIC_JITSI_DOMAIN.
  jitsiDomain: ""

  # ── Il bot invisibile ──────────────────────────────────────────────
  # Prosody ha un VirtualHost "nascosto" (lo stesso che usa Jibri) e ogni
  # client jitsi-meet confronta il dominio del JID in presenza con
  # `config.hiddenDomain`: se coincide, il partecipante non compare
  # nell'elenco, non prende un riquadro, non genera la notifica di ingresso e
  # non entra nel conteggio. E' il meccanismo nativo di Jitsi per i bot.
  #
  # Valorizzando `hiddenDomain` il recorder si autentica li' invece che col JWT
  # del portale. Richiede DUE cose sul lato Prosody:
  #   1. l'account esista (l'immagine jitsi lo crea con ENABLE_RECORDING);
  #   2. l'ACCOUNT sia in `token_verification_allowlist` sul componente MUC —
  #      altrimenti, con l'autenticazione a token, l'ingresso viene rifiutato.
  #      Si imposta senza toccare i file di config:
  #        XMPP_MUC_CONFIGURATION: 'token_verification_allowlist = { "recorder@<dominio>" }'
  #      Il singolo account, NON l'intero dominio: chi ha quella password entra
  #      in qualunque stanza senza token, quindi la deroga si tiene stretta.
  #
  #   La password va PINNATA nei values (`jitsi-meet.jibri.recorder.password`):
  #   il subchart la rigenera con `randAlphaNum` a ogni upgrade se non lo e', e
  #   il bot si ritroverebbe credenziali diverse da quelle registrate su
  #   Prosody. In quel caso ricade sul JWT — registra comunque, ma torna
  #   visibile in stanza.
  # Vuoto = disattivato: il bot entra col JWT e resta VISIBILE in stanza.
  hiddenDomain: ""
  # Secret con le credenziali del bot. OBBLIGATORIO se `hiddenDomain` e'
  # valorizzato — niente default indovinato: il nome dipende da come e'
  # installato il subchart (fullnameOverride, jibri disattivato,
  # existingSecretName) e un nome sbagliato non fallirebbe il render, fallirebbe
  # ogni Job a evento gia' iniziato. Di norma e' quello che il subchart crea per
  # Jibri: `<release>-jitsi-meet-jibri-secret-recorder`.
  xmppSecretName: ""
  xmppSecretUserKey: "JIBRI_RECORDER_USER"
  xmppSecretPasswordKey: "JIBRI_RECORDER_PASSWORD"
  backoffLimit: 1
  activeDeadlineSeconds: 21600   # 6h max per evento
  ttlSecondsAfterFinished: 600
  workSizeLimit: "10Gi"
  # Timing del bot (env IDLE_TIMEOUT_SEC / INITIAL_GRACE_SEC / MAX_DURATION_SEC,
  # vedi infra/recorder/src/capture.ts). Se vuoti → default del bot
  # (idle 90s, grace 900s, max 4h). initialGrace abbassato di default: il
  # controller spawna il recorder solo su evento GIA' LIVE, quindi 15min di
  # attesa a vuoto su un pod Chrome (1 CPU/2Gi) è quasi sempre spreco.
  idleTimeoutSec: ""        # "" → 90s (default capture.ts)
  initialGraceSec: 300      # 5min invece di 15min
  maxDurationSec: ""        # "" → 4h (default capture.ts); tieni <= activeDeadlineSeconds
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  # Operator riconciliante (pod fisso) che orchestra i Job recorder.
  controller:
    enabled: true
    image: ghcr.io/italia/pa-webinar-recorder-controller:dev
    imagePullPolicy: IfNotPresent
    imagePullSecrets: []
    port: 8080
    reconcileIntervalMs: 30000
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "250m"
        memory: "128Mi"

# ── Name overrides ──────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""
