# Buffer UDP per il bridge della conferenza (Jitsi Videobridge). Il bridge
# chiede 10 MiB per il socket della porta 10000/udp; con il massimo di
# sistema predefinito (circa 208 KiB) ne ottiene una frazione, e con molti
# flussi video i pacchetti in eccesso si perdono. Installato da
# install-server.sh e install-agent.sh (--no-sysctl per saltarlo).
net.core.rmem_max = 10485760
net.core.wmem_max = 10485760
