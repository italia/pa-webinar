          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          echo '| captions-gateway | `dev`, `dev-${{ steps.tags.outputs.sha_short }}` |' >> "$GITHUB_STEP_SUMMARY"

  # ── Captions Engine ──
  # Motore dei sottotitoli live (NeMo-Speech.cpp per CPU): l'immagine porta
