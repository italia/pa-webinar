name: Build patched jitsi/web image

# Builds ghcr.io/italia/pa-webinar-jitsi-web — a copy of the upstream jitsi/web
# carrying our in-place patches (see infra/jitsi-web-patched/Dockerfile):
#   • noise suppression — AudioContext forced to 48 kHz, so a microphone at a
#     different sample rate is no longer silenced;
#   • flying reaction emoji set to pointer-events:none;
#   • self-view — an explicit config.disableSelfView=false overrides the value
#     stored in the user's browser, so a participant stuck with a hidden self
#     view recovers instead of needing an incognito window.
# Rarely changes, so it runs only when that directory changes or on manual
# dispatch — NOT on every dev push.
#
# IMAGE_TAG is bumped with every patch change instead of re-pushing the same
# tag: prod pins this tag in its Helm values, and a mutable tag makes "which
# build is actually running?" unanswerable and a rollback impossible.

on:
  push:
    branches: [dev]
    paths:
      - "infra/jitsi-web-patched/**"
      - ".github/workflows/jitsi-web.yml"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: italia/pa-webinar-jitsi-web
  IMAGE_TAG: stable-11031-rnnoise
  # La base (tag e impronta) sta in un posto solo: i default di BASE_TAG e
  # BASE_DIGEST nel Dockerfile. Il primo passo li legge e ne ricava BASE_IMAGE.

jobs:
  build:
    # La quota artefatti di Actions e' dell'ORGANIZZAZIONE, non di questo repo
    # (qui siamo sotto i 50 MB): quando si esaurisce OGNI upload fallisce, e con
    # lui il job — anche a immagine gia' pubblicata. Il "build record" di buildx
    # e' un artefatto per ogni build che nessuno scarica mai.
    env:
      DOCKER_BUILD_SUMMARY: "false"
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    name: Build & validate patched jitsi/web
    # Self-hosted ARC runner in the cluster, like the build jobs of dev.yml and
    # release.yml. The workflow runs only on push to dev and on manual
    # dispatch, never on pull_request.
    runs-on: arc-runner-pa-webinar
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # La base si legge dal Dockerfile, l'unico posto dove e' scritta, e si
      # confronta con il registro: se il tag a monte non punta piu'
      # all'impronta fissata (spostato, o impronta non aggiornata insieme al
      # tag) la costruzione si ferma qui invece di patchare una base diversa da
      # quella dichiarata.
      - name: Read and check the pinned base
        run: |
          set -euo pipefail
          df=infra/jitsi-web-patched/Dockerfile
          tag="$(sed -n 's/^ARG BASE_TAG=//p' "$df")"
          digest="$(sed -n 's/^ARG BASE_DIGEST=//p' "$df")"
          if [ -z "$tag" ] || [ -z "$digest" ]; then
            echo "::error::${df} must set defaults for BASE_TAG and BASE_DIGEST"
            exit 1
          fi
          actual="$(docker buildx imagetools inspect "jitsi/web:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [ "$actual" != "$digest" ]; then
            echo "::error::jitsi/web:${tag} is ${actual}; the Dockerfile pins ${digest}"
            exit 1
          fi
          {
            echo "BASE_TAG=${tag}"
            echo "BASE_DIGEST=${digest}"
            echo "BASE_IMAGE=jitsi/web:${tag}@${digest}"
          } >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally, don't push yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./infra/jitsi-web-patched
          file: ./infra/jitsi-web-patched/Dockerfile
          load: true
          push: false
          # The docker exporter (load:true) can't carry provenance/SBOM
          # attestations; leaving them on makes buildx emit an image index the
          # local daemon refuses to load. Disable so the exact validated image
          # loads and is then `docker push`ed unchanged.
          provenance: false
          # Nessun build-arg: la base e' quella dei default del Dockerfile,
          # appena controllata.
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      # Independent post-build gate on the EXACT image that will be pushed.
      # The Dockerfile RUN already fails the build if the patch is wrong, so the
      # grep counts here are deliberate belt-and-suspenders for a mic-silencing-
      # critical image; the unique add is `node --check` (bundle still parses).
      - name: Validate patched bundle
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          docker run --rm --entrypoint cat "$IMG" /usr/share/jitsi-meet/libs/app.bundle.min.js > patched.js
          docker run --rm --entrypoint cat "$BASE_IMAGE" /usr/share/jitsi-meet/libs/app.bundle.min.js > orig.js
          # Count OCCURRENCES with `grep -oF … | wc -l` — NOT `grep -c`/`grep -oc`,
          # which count matching LINES and always return 1 on this single-line
          # minified bundle.
          #
          # Nessun identificatore minificato compare qui: cambiano a ogni build
          # di upstream (la variabile del contesto rumore e' stata `Xy`, poi
          # `Vs`) e un ago scritto a mano trasforma ogni bump di versione in
          # archeologia. Si controlla la FORMA, sull'immagine esatta che verra'
          # pubblicata: la patch presente una volta sola, il bersaglio sparito
          # dal bundle patchato e presente una volta sola in quello originale
          # (cosi' un bersaglio mancante non passa per "gia' a posto"). Il
          # contesto del mixer locale — `this.audioContext=new AudioContext,` —
          # non ha la parentesi e non entra in nessuno di questi conteggi.
          test "$(grep -oF '=new AudioContext({sampleRate:48000}))' patched.js | wc -l | tr -d ' ')" = "1"
          test "$(grep -oF '=new AudioContext)' patched.js | wc -l | tr -d ' ')" = "0"
          test "$(grep -oF '=new AudioContext)' orig.js | wc -l | tr -d ' ')" = "1"
          # Syntax-validate. The extraction above uses `--entrypoint cat`: without
          # it the image's s6 init runs first and prepends its own lines to the
          # file, so BOTH bundles failed to parse — and the "only gate when the
          # baseline parses" fallback below meant this check silently never ran.
          # It does now, and it is the guard that matters most for a bundle we
          # edit by hand.
          if node --check orig.js 2>/dev/null; then
            node --check patched.js
            echo "patched bundle is valid JS (node --check) and carries every patch"
          else
            echo "::warning::node cannot parse the UNPATCHED bundle either — falling back to the Dockerfile's before/after grep guards"
          fi
          # CSS patch (#3): the reaction overlay must be click-through, exactly
          # once, and the selector it targets must still exist upstream — a
          # silently-renamed class would leave the rule inert and the toolbar
          # unclickable again during a reaction burst.
          docker run --rm --entrypoint cat "$IMG" /usr/share/jitsi-meet/css/all.css > patched.css
          docker run --rm --entrypoint cat "$BASE_IMAGE" /usr/share/jitsi-meet/css/all.css > orig.css
          test "$(grep -oF 'pa-webinar reactions overlay' patched.css | wc -l | tr -d ' ')" = "1"
          test "$(grep -oF 'pa-webinar reactions overlay' orig.css | wc -l | tr -d ' ')" = "0"
          grep -qF '.reactions-animations-container,.reactions-animations-container *{pointer-events:none!important}' patched.css
          grep -qF '.reactions-animations-container{' orig.css
          echo "reaction overlay is click-through and the upstream selector is unchanged"
          # Self-view patch: an explicit config.disableSelfView=false must win
          # over the value stored in the browser, and the visitor rule must be
          # untouched. Verified on the exact bundle that will be pushed.
          # Anche qui per forma: il nome della funzione sui visitatori e' un
          # identificatore minificato e cambia a ogni build, quindi lo si lascia
          # indeterminato invece di fissarlo.
          SELV='e\["features/base/config"\]\.disableSelfView\|\|e\["features/base/settings"\]\.disableSelfView\|\|[A-Za-z0-9_$]+\(e\)'
          test "$(grep -oE '\(!1!==e\["features/base/config"\]\.disableSelfView&&' patched.js | wc -l | tr -d ' ')" = "1"
          test "$(grep -oE "$SELV" patched.js | wc -l | tr -d ' ')" = "0"
          test "$(grep -oE "$SELV" orig.js | wc -l | tr -d ' ')" = "1"
          echo "self-view selector patched exactly once, and the upstream form is gone"

      # Un tag pubblicato non si riscrive con un contenuto diverso: chi lo usa
      # (il default del chart, le installazioni che lo fissano) non potrebbe
      # piu' tornare all'immagine di prima. Se IMAGE_TAG esiste gia', si
      # confrontano gli strati della base, la configurazione dell'immagine e
      # l'impronta di ogni file e collegamento: tutto uguale, la ricostruzione
      # non porta niente e non si pubblica; qualunque differenza ferma il job,
      # che chiede un IMAGE_TAG nuovo. Solo un "not found" del registro vale
      # come "tag mai pubblicato": ogni altro errore ferma il job.
      - name: Decide whether to push
        id: publish
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          if out="$(docker buildx imagetools inspect "$IMG" 2>&1)"; then
            :
          elif printf '%s' "$out" | grep -qiE 'not found|manifest unknown'; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "::error::cannot tell whether ${IMG} is published: ${out}"
            exit 1
          fi
          docker tag "$IMG" pa-webinar-jitsi-web:candidate
          docker pull --quiet "$IMG" > /dev/null
          # `awk` e non `head`: legge tutto l'ingresso, quindi con pipefail
          # docker non muore di SIGPIPE e lo stato della pipeline e' il suo.
          # Con 0 strati non stampa nulla, come `head -n 0`.
          strati() { docker image inspect -f '{{range .RootFS.Layers}}{{println .}}{{end}}' "$1" | awk -v n="$2" 'NR <= n'; }
          config() { docker image inspect -f '{{json .Config.Env}} {{json .Config.Entrypoint}} {{json .Config.Cmd}} {{json .Config.User}} {{json .Config.WorkingDir}} {{json .Config.ExposedPorts}} {{json .Config.Volumes}}' "$1"; }
          # Ogni voce del filesystem con tipo, permessi, proprietario e
          # destinazione dei collegamenti, piu' l'impronta di ogni file. Senza
          # -xdev: le cartelle VOLUME dell'immagine arrivano come mount, con il
          # contenuto dell'immagine, e vanno contate. Restano fuori solo i
          # filesystem virtuali e i file che il motore dei container scrive.
          contenuto() {
            docker run --rm --network none --entrypoint sh "$1" -c '
              salta="-path /proc -o -path /sys -o -path /dev -o -path /etc/hosts -o -path /etc/hostname -o -path /etc/resolv.conf"
              find / \( $salta \) -prune -o -printf "%y %m %U:%G %p -> %l\n" | sort
              find / \( $salta \) -prune -o -type f -print0 | sort -z | xargs -0 sha256sum
            ' | sha256sum | cut -d' ' -f1
          }
          # Ogni misura in un'assegnazione a parte, mai dentro gli argomenti di
          # `[`: li' un errore di docker si perdeva, e due misure fallite
          # (vuote, o l'impronta di un testo vuoto) risultavano uguali, cioe'
          # "niente da pubblicare" anche con file diversi. Qui un errore, o una
          # misura vuota, ferma il job.
          misura() {
            local valore
            if ! valore="$("$@")" || [ -z "$valore" ]; then
              echo "::error::cannot compare with the published image: '$1' failed on $2" >&2
              return 1
            fi
            printf '%s\n' "$valore"
          }
          n="$(docker image inspect -f '{{len .RootFS.Layers}}' "$BASE_IMAGE")"
          diverso=""
          a="$(misura strati pa-webinar-jitsi-web:candidate "$n")"
          b="$(misura strati "$IMG" "$n")"
          [ "$a" = "$b" ] || diverso="the base layers"
          if [ -z "$diverso" ]; then
            a="$(misura config pa-webinar-jitsi-web:candidate)"
            b="$(misura config "$IMG")"
            [ "$a" = "$b" ] || diverso="the image configuration"
          fi
          if [ -z "$diverso" ]; then
            a="$(misura contenuto pa-webinar-jitsi-web:candidate)"
            b="$(misura contenuto "$IMG")"
            [ "$a" = "$b" ] || diverso="the files"
          fi
          if [ -n "$diverso" ]; then
            echo "::error::${IMG} is already published and differs in ${diverso}: give this change a new IMAGE_TAG"
            exit 1
          fi
          echo "::notice::${IMG} is already published with the same base, configuration and files: nothing to push"
          echo "push=false" >> "$GITHUB_OUTPUT"

      # Push the EXACT image that was validated above (loaded into the local
      # daemon in the build step) — do NOT rebuild, or the pushed artifact could
      # diverge from the validated one (mutable base tag, cache drift).
      - name: Push validated image
        if: steps.publish.outputs.push == 'true'
        run: docker push "${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Summary
        env:
          PUSHED: ${{ steps.publish.outputs.push }}
        run: |
          {
            if [ "$PUSHED" = "true" ]; then
              echo "### Patched jitsi/web pushed"
            else
              echo "### Patched jitsi/web unchanged: already published, nothing pushed"
            fi
            echo ""
            echo "\`${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}\` — base \`${BASE_IMAGE}\`, rnnoise AudioContext at 48 kHz, reaction overlay pointer-events:none, self-view config-overridable."
          } >> "$GITHUB_STEP_SUMMARY"
