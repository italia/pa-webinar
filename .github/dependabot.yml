# Dependabot — configurazione aggiornamenti.
#
# Politica MAJOR: i major delle dipendenze in `ignore` non arrivano come
# aggiornamenti di routine. Si fanno come upgrade DEDICATI (codice adattato,
# gate completo, code review), mai come merge di massa: e' cosi' che si
# introducono regressioni.
#
# `version-update:semver-major` NON silenzia gli avvisi di SICUREZZA: se esce
# una CVE su una di queste dipendenze, Dependabot apre comunque la PR.
#
# `@types/node` va allineato al major di Node a runtime (immagini e CI): si
# sposta a mano, nello stesso cambio che sposta il runtime, mai da solo.
version: 2
updates:
# Il package.json alla RADICE dichiara i workspace (app, lobby): questo blocco
# copre le dipendenze di tutti e tre, con un solo package-lock. Un secondo
# blocco su /app aprirebbe le stesse PR due volte.
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
  labels:
  - dependencies
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: next
    update-types:
    - version-update:semver-major
  - dependency-name: react
    update-types:
    - version-update:semver-major
  - dependency-name: react-dom
    update-types:
    - version-update:semver-major
  - dependency-name: '@prisma/client'
    update-types:
    - version-update:semver-major
  - dependency-name: prisma
    update-types:
    - version-update:semver-major
  - dependency-name: zod
    update-types:
    - version-update:semver-major
  - dependency-name: eslint
    update-types:
    - version-update:semver-major
  - dependency-name: eslint-config-next
    update-types:
    - version-update:semver-major
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
  - dependency-name: ical-generator
    update-types:
    - version-update:semver-major
  - dependency-name: nanoid
    update-types:
    - version-update:semver-major
  - dependency-name: ioredis
    update-types:
    - version-update:semver-major
  - dependency-name: '@fullcalendar/*'
    update-types:
    - version-update:semver-major
  - dependency-name: phaser
    update-types:
    - version-update:semver-major
  # Con vite 8, caricare il pacchetto CommonJS di design-react-kit porta
  # NODE_ENV a "production" dentro i test dell'app, che falliscono con
  # "jsxDEV is not a function". vite (dichiarato da app e lobby) e
  # @vitejs/plugin-react 6, che lo chiede, restano fermi finche' non e'
  # risolto.
  - dependency-name: vite
    update-types:
    - version-update:semver-major
  - dependency-name: '@vitejs/plugin-react'
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - docker
# Recorder e controller stanno FUORI dai workspace npm: hanno un package-lock
# proprio. Sono anche le immagini piu' delicate
# del progetto: il recorder gira Chrome headless e maneggia audio
# per-partecipante (dato dell'art. 9).
- package-ecosystem: npm
  directory: /infra/recorder
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: puppeteer
    update-types:
    - version-update:semver-major
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
- package-ecosystem: npm
  directory: /infra/recorder-controller
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
  - dependency-name: '@kubernetes/client-node'
    update-types:
    - version-update:semver-major
# Il gateway dei sottotitoli live: fuori dai workspace npm come il recorder,
# con un package-lock proprio.
- package-ecosystem: npm
  directory: /infra/captions/gateway
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
# Il worker della pipeline AI. Lo stack CUDA (torch/whisperx/numpy) e' pinnato
# a mano e self-consistent: i major qui vanno provati su GPU, mai automatici.
- package-ecosystem: pip
  directory: /infra/ai/worker
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - python
  ignore:
  - dependency-name: torch
    update-types:
    - version-update:semver-major
  - dependency-name: torchvision
    update-types:
    - version-update:semver-major
  - dependency-name: torchaudio
    update-types:
    - version-update:semver-major
  - dependency-name: numpy
    update-types:
    - version-update:semver-major
  - dependency-name: transformers
    update-types:
    - version-update:semver-major
  - dependency-name: whisperx
    update-types:
    - version-update:semver-major
  - dependency-name: audioseal
    update-types:
    - version-update:semver-major
  # Dalla 1.3 piper-tts e' GPL-3.0-or-later: salire e' una decisione di
  # licenza, non un aggiornamento.
  - dependency-name: piper-tts
    versions:
    - '>=1.3'
  - dependency-name: pydantic
    update-types:
    - version-update:semver-major
  - dependency-name: pyannote.audio
    update-types:
    - version-update:semver-major
  - dependency-name: faster-whisper
    update-types:
    - version-update:semver-major
  - dependency-name: ctranslate2
    update-types:
    - version-update:semver-major
  - dependency-name: torchcodec
    update-types:
    - version-update:semver-major
  - dependency-name: huggingface-hub
    update-types:
    - version-update:semver-major
  - dependency-name: nltk
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directory: /infra/recorder
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - docker
  ignore:
  - dependency-name: node
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directory: /infra/recorder-controller
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - docker
  ignore:
  - dependency-name: node
    update-types:
    - version-update:semver-major
- package-ecosystem: docker
  directory: /infra/captions/gateway
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - docker
  ignore:
  - dependency-name: node
    update-types:
    - version-update:semver-major
# Il motore dei sottotitoli: Dependabot aggiorna l'immagine di base. Versione
# e impronta del motore sono fissate a mano nel Dockerfile, e cambiarle vuol
# dire rifare il banco di prova (infra/captions/bench).
- package-ecosystem: docker
  directory: /infra/captions/engine
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - docker
# Il worker senza GPU gira su python:<versione>-alpine: le wheel musl delle
# sue dipendenze (oggi pydantic-core di pydantic 2.9.2, fino alla 3.13)
# arrivano dopo una versione nuova di Python, e senza compilatore il build
# si ferma. Il salto di versione si fa a mano,
# insieme alle dipendenze; Dependabot aggiorna solo Alpine e le patch.
- package-ecosystem: docker
  directory: /infra/ai
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - docker
  ignore:
  - dependency-name: library/python
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
# ATTENZIONE: questa immagine e' la build PATCHATA di jitsi/web (rnnoise 48kHz).
# Un bump dell'immagine base perde la patch -> vedi `ignore` sotto.
- package-ecosystem: docker
  directory: /infra/jitsi-web-patched
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - docker
  ignore:
  - dependency-name: jitsi/web
    update-types:
    - version-update:semver-major
  - dependency-name: node
    update-types:
    - version-update:semver-major
# GitHub Actions: le action sono SHA-pinnate; Dependabot aggiorna SHA + commento.
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - ci
