# Dependabot — configurazione aggiornamenti.
#
# Politica MAJOR: i major delle dipendenze in `ignore` non arrivano come
# aggiornamenti di routine. Si fanno come upgrade DEDICATI (codice adattato,
# gate completo, code review), mai come merge di massa: e' cosi' che si
# introducono regressioni.
#
# `version-update:semver-major` NON silenzia gli avvisi di SICUREZZA: se esce
# una CVE su una di queste dipendenze, Dependabot apre comunque la PR.
#
# `@types/node` va allineato al major di Node a runtime (immagini e CI): si
# sposta a mano, nello stesso cambio che sposta il runtime, mai da solo.
version: 2
updates:
# Il package.json alla RADICE dichiara i workspace (app, lobby): questo blocco
# copre le dipendenze di tutti e tre, con un solo package-lock. Un secondo
# blocco su /app aprirebbe le stesse PR due volte.
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 10
  labels:
  - dependencies
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: next
    update-types:
    - version-update:semver-major
  - dependency-name: react
    update-types:
    - version-update:semver-major
  - dependency-name: react-dom
    update-types:
    - version-update:semver-major
  - dependency-name: '@prisma/client'
    update-types:
    - version-update:semver-major
  - dependency-name: prisma
    update-types:
    - version-update:semver-major
  - dependency-name: zod
    update-types:
    - version-update:semver-major
  - dependency-name: '@asteasolutions/zod-to-openapi'
    update-types:
    - version-update:semver-major
  # Dalla 1.0 MediaPipe include la telemetria verso Google: resta fissato
  # alla 0.10.35 (app/package.json).
  - dependency-name: '@mediapipe/tasks-vision'
    versions:
    - '>=1.0.0'
  - dependency-name: eslint
    update-types:
    - version-update:semver-major
  - dependency-name: eslint-config-next
    update-types:
    - version-update:semver-major
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
  - dependency-name: ical-generator
    update-types:
    - version-update:semver-major
  - dependency-name: nanoid
    update-types:
    - version-update:semver-major
  - dependency-name: ioredis
    update-types:
    - version-update:semver-major
  - dependency-name: '@fullcalendar/*'
    update-types:
    - version-update:semver-major
  - dependency-name: phaser
    update-types:
    - version-update:semver-major
  # Con vite 8, caricare il pacchetto CommonJS di design-react-kit porta
  # NODE_ENV a "production" dentro i test dell'app, che falliscono con
  # "jsxDEV is not a function". vite (dichiarato da app e lobby) e
  # @vitejs/plugin-react 6, che lo chiede, restano fermi finche' non e'
  # risolto.
  - dependency-name: vite
    update-types:
    - version-update:semver-major
  - dependency-name: '@vitejs/plugin-react'
    update-types:
    - version-update:semver-major
# Immagini di base, tutte fissate per impronta (`tag@sha256:...`): Dependabot
# aggiorna l'impronta quando il tag si muove a monte e la versione quando ne
# esce una nuova. Una PR per immagine, che aggiorna insieme tutte le cartelle
# che la usano (`group-by: dependency-name`): le basi uguali restano allineate,
# e un aggiornamento che rompe una build non trattiene quelli delle altre.
#  - Il major di Node a runtime si sposta a mano, insieme a `@types/node` e
#    alla CI.
#  - Recorder e controller sono le immagini piu' delicate del progetto: il
#    recorder gira Chrome headless e maneggia audio per-partecipante (dato
#    dell'art. 9).
#  - Il motore dei sottotitoli: qui si aggiorna solo l'immagine di base.
#    Versione e impronta del motore sono fissate a mano nel Dockerfile, e
#    cambiarle vuol dire rifare il banco di prova (infra/captions/bench).
#  - Il worker senza GPU gira su python:<versione>-alpine: le wheel musl delle
#    sue dipendenze arrivano dopo una versione nuova di Python, e senza
#    compilatore il build si ferma. Il salto di versione si fa a mano, insieme
#    alle dipendenze; Dependabot aggiorna solo Alpine e le patch.
#  - La jitsi/web patchata NON e' qui: base e stadio `node` si aggiornano a
#    mano insieme alla release di Jitsi (infra/jitsi-web-patched/README.md),
#    perche' la patch e' provata sulla build esatta della base, e il workflow
#    non ripubblica un tag gia' uscito.
- package-ecosystem: docker
  directories:
  - /
  - /infra/recorder
  - /infra/recorder-controller
  - /infra/captions/gateway
  - /infra/captions/engine
  - /infra/ai
  - /scripts/load-test
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - docker
  groups:
    base-images:
      group-by: dependency-name
  ignore:
  - dependency-name: library/node
    update-types:
    - version-update:semver-major
  - dependency-name: node
    update-types:
    - version-update:semver-major
  - dependency-name: library/python
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  # Il generatore di carico: un major di Maven o del JDK si prova a mano.
  - dependency-name: library/maven
    update-types:
    - version-update:semver-major
  - dependency-name: maven
    update-types:
    - version-update:semver-major
# Recorder e controller stanno FUORI dai workspace npm: hanno un package-lock
# proprio. Sono anche le immagini piu' delicate
# del progetto: il recorder gira Chrome headless e maneggia audio
# per-partecipante (dato dell'art. 9).
- package-ecosystem: npm
  directory: /infra/recorder
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: puppeteer
    update-types:
    - version-update:semver-major
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
- package-ecosystem: npm
  directory: /infra/recorder-controller
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
  - dependency-name: '@kubernetes/client-node'
    update-types:
    - version-update:semver-major
# Il gateway dei sottotitoli live: fuori dai workspace npm come il recorder,
# con un package-lock proprio.
- package-ecosystem: npm
  directory: /infra/captions/gateway
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  groups:
    minor-and-patch:
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: typescript
    update-types:
    - version-update:semver-major
  - dependency-name: '@types/node'
    update-types:
    - version-update:semver-major
# Il worker della pipeline AI. Lo stack CUDA (torch/whisperx/numpy) e' pinnato
# a mano e self-consistent: i major qui vanno provati su GPU, mai automatici.
- package-ecosystem: pip
  directory: /infra/ai/worker
  schedule:
    interval: weekly
    day: monday
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - python
  ignore:
  - dependency-name: torch
    update-types:
    - version-update:semver-major
  - dependency-name: torchvision
    update-types:
    - version-update:semver-major
  - dependency-name: torchaudio
    update-types:
    - version-update:semver-major
  # Il worker fissa la build per CUDA 12.6, che per la 2.11.1 non esiste.
  - dependency-name: torchaudio
    versions:
    - 2.11.1
  # transformers dalla 5.21 chiede Python 3.11 o successivo.
  - dependency-name: transformers
    versions:
    - ">=5.21"
  # Il worker GPU gira sul Python 3.10 dell'immagine NGC: numpy dalla 2.3
  # chiede Python 3.11 o successivo, pandas 3 lo stesso. Le minor di numpy si
  # aggiornano a mano anche per il worker senza GPU, che sta nella stessa
  # cartella.
  - dependency-name: numpy
    update-types:
    - version-update:semver-major
    - version-update:semver-minor
  - dependency-name: pandas
    update-types:
    - version-update:semver-major
  - dependency-name: transformers
    update-types:
    - version-update:semver-major
  - dependency-name: whisperx
    update-types:
    - version-update:semver-major
  - dependency-name: audioseal
    update-types:
    - version-update:semver-major
  # Dalla 1.3 piper-tts e' GPL-3.0-or-later: salire e' una decisione di
  # licenza, non un aggiornamento.
  - dependency-name: piper-tts
    versions:
    - '>=1.3'
  - dependency-name: pydantic
    update-types:
    - version-update:semver-major
  - dependency-name: pyannote.audio
    update-types:
    - version-update:semver-major
  - dependency-name: faster-whisper
    update-types:
    - version-update:semver-major
  - dependency-name: ctranslate2
    update-types:
    - version-update:semver-major
  - dependency-name: torchcodec
    update-types:
    - version-update:semver-major
  - dependency-name: huggingface-hub
    update-types:
    - version-update:semver-major
  - dependency-name: nltk
    update-types:
    - version-update:semver-major
# PyYAML per validate-chart.sh in CI: file compilato con le impronte.
- package-ecosystem: pip
  directory: /scripts
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - python
# GitHub Actions: le action sono SHA-pinnate; Dependabot aggiorna SHA + commento.
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
  labels:
  - dependencies
  - ci
